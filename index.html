for(let w=1;w<=4;w++)PPP[w]={D1:[E('Competition SQ',3,'2','60〜65% / RPE 5〜6','Technique'),E('Competition BP',3,'2','60〜65% / RPE 5〜6','Technique'),E('Competition DL',2,'2','60〜65% / RPE 5〜6','素手'),E('ブルガリアンスクワット',2,'8/脚','RPE 5〜6')],D2:[E('Competition SQ',3,'3','77.5〜82.5% / RPE 7〜8','Main Strength'),E('Competition BP',3,'3','77.5〜82.5% / RPE 7〜8','Main Strength'),E('Stiff-leg DL',3,'4','65〜72.5% / RPE 6〜7','パワーグリップ'),E('RDL',2,'6〜8','RPE 6〜7'),E('ハイローマシン',3,'8〜12','RPE 7〜8')],D3:[E('High-bar SQ',3,'4','65〜72.5% / RPE 6〜7','SQ variation'),E('Larsen BP',3,'4','67.5〜75% / RPE 6〜7','BP variation'),E('Competition DL',2,'2','60〜65% / RPE 5〜6','素手'),E('バーベルカール',2,'8〜12','RPE 7〜8')],D4:[E('Competition BP',3,'2','82.5〜87.5% / RPE 7.5〜8.5','Heavy / Specificity'),E('Competition DL',3,'1〜2','80〜87.5% / RPE 7〜8.5','パワーグリップ'),E('ナローベンチ',2,'5〜8','RPE 7'),E('OHP',2,'5〜8','RPE 7')],D5:[E('Pause SQ',3,'3','60〜70% / RPE 6前後','Drum Protection'),E('ワイドグリップTバーロウ',2,'8〜10','RPE 6〜7')]};
PPP[5]={D1:[E('Competition SQ',4,'4','約70%','Competition volume'),E('Competition BP',4,'4','約70%','Competition volume'),E('Competition DL',2,'3','65〜67.5%','素手')],D2:[E('Competition SQ',4,'4','約75%'),E('Competition BP',4,'4','約75%'),E('Competition DL',3,'3','70〜72.5%','パワーグリップ')],D3:[E('Competition SQ',3,'4','約70%'),E('Competition BP',4,'4','72.5〜75%')],D4:[E('Competition BP',3,'3','77.5〜80%'),E('Competition DL',3,'2','75〜80%','パワーグリップ')],D5:[E('Competition SQ',3,'3','65〜70%'),E('Competition BP',3,'3','65〜70%'),E('Competition DL',2,'3','65〜67.5%','素手')]};
PPP[6]={D1:[E('Competition SQ',1,'3','80%'),E('Competition SQ',1,'2','85%'),E('Competition SQ',1,'1','90%','状態確認上限'),E('Competition BP',1,'3','80%'),E('Competition BP',1,'2','85%'),E('Competition BP',1,'1','90%','状態確認上限')],D2:[E('Competition DL',1,'2','80%','パワーグリップ'),E('Competition DL',1,'1','87.5%','パワーグリップ'),E('Competition DL',1,'1','90%','状態確認上限'),E('Competition BP',1,'3','80%'),E('Competition BP',1,'2','85%')],D3:[E('Competition SQ',1,'2','80%'),E('Competition SQ',1,'1','85%'),E('Competition BP',2,'3','80%')],D4:[E('Competition DL',1,'2','80%'),E('Competition DL',1,'1','85%'),E('Competition BP',1,'2','80%')]};
PPP[7]={D1:[E('Competition SQ',3,'2','75%'),E('Competition BP',3,'3','75%')],D2:[E('Competition DL',3,'1','70〜75%')],D3:[E('Competition BP',2,'3','75%')]};
PPP[8]={'TEST前':[E('Competition SQ',1,'2','50〜60%','動作確認のみ'),E('Competition BP',1,'2','50〜60%','動作確認のみ'),E('Competition DL',1,'1','50〜60%','動作確認のみ')],'TEST':[E('SQ 1RM',3,'試技','SQ → BP → DL'),E('BP 1RM',3,'試技','SQ → BP → DL'),E('DL 1RM',3,'試技','SQ → BP → DL')]};
const state=JSON.parse(localStorage.getItem(STORAGE+'_state')||localStorage.getItem(LEGACY_STORAGE+'_state')||'null')||{page:'HOME',bbbDay:1,bbbPart:'脚',pppWeek:1,pppDay:'D1',current:null};
state.bbbDay??=1;
let db=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(LEGACY_STORAGE)||'{"sessions":{}}');db.sessions??={};
let workStarted=Number(db.workStarted||0),workElapsed=Number(db.workElapsed||0),modal={k:null,id:null,part:'脚'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,s)%60)).padStart(2,'0');
const fmtLong=s=>String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(Math.floor(s)%60).padStart(2,'0');
function save(){localStorage.setItem(STORAGE,JSON.stringify(db));localStorage.setItem(STORAGE+'_state',JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}
function navDraw(){document.getElementById('nav').innerHTML=['HOME','PRE','BBB','PPP','HISTORY'].map(t=>`<button class="${state.page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}
function toggleNav(){document.getElementById('nav').classList.toggle('show')}
function go(p){state.page=p;save();navDraw();render();scrollTo(0,0)} function goHome(){if(state.page==='HOME')toggleNav();else go('HOME')}
function changeBBB(p){state.bbbPart=p;save();render()} function changeBBBDay(d){state.bbbDay=Number(d)||1;save();render()} function changePPPWeek(w){state.pppWeek=w;state.pppDay=Object.keys(PPP[w]||{})[0]||'D1';save();render()} function changePPPDay(d){state.pppDay=d;save();render()}
function key(){if(state.page==='PRE')return 'PRE|Week1';if(state.page==='BBB')return 'BBB|D'+state.bbbDay+'|'+state.bbbPart;if(state.page==='PPP')return 'PPP|W'+state.pppWeek+'|'+state.pppDay;return ''}
function session(k){db.sessions[k]??={date:'',weight:'',sleep:0,fatigue:0,note:'',exercises:{},savedAt:0,history:[]};return db.sessions[k]}
function ensureEx(k,i,e){const s=session(k),id='ex'+i;s.exercises[id]??={name:e.name,mainCount:e.sets,ascCount:3,ascOpen:false,note:'',hidden:false,};const x=s.exercises[id];x.name??=e.name;x.mainCount??=e.sets||1;x.ascCount??=3;x.hidden=!!x.hidden;x.timer??={rest:120,exercise:300};return x}
function row(k,id,key){const s=session(k);s.sets??={};return s.sets[key]??(s.sets[key]={})}
function drops(k,id,i){const s=session(k);s.drops??={};const key=id+'#main#'+i;s.drops[key]??=[];return s.drops[key]}
function setMeta(k,f,v){session(k)[f]=v;save()}
function metaHTML(k){const s=session(k);return `<div class="meta"><div><label>日付</label><input type="date" value="${esc(s.date||'')}" onchange="setMeta('${esc(k)}','date',this.value)"></div><div><label>体重 kg（任意）</label><input inputmode="decimal" value="${esc(s.weight||'')}" oninput="setMeta('${esc(k)}','weight',this.value)"></div><div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.sleep==n?'on':''}" onclick="setMeta('${esc(k)}','sleep',${n})">${n}</button>`).join('')}</div></div><div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.fatigue==n?'on':''}" onclick="setMeta('${esc(k)}','fatigue',${n})">${n}</button>`).join('')}</div></div></div>`}
function badge(name){if(/SQ|スクワット|レッグ|ブルガリア/.test(name))return ['脚','b-leg'];if(/BP|ベンチ|フライ|ディップ/.test(name))return ['胸','b-chest'];if(/DL|デッド|ロウ|ロー|ラット|RDL|T.?bar|Tバ/.test(name))return ['背','b-back'];if(/OHP|ショルダー|サイド|リア|アップライト/.test(name))return ['肩','b-shoulder'];if(/JM|トライ|クローズグリップ|OHエクステンション/.test(name))return ['三頭','b-tri'];if(/カール|プリーチャー/.test(name))return ['二頭','b-bi'];if(/リスト/.test(name))return ['前腕','b-fore'];if(/腹|アブ|クランチ|レッグレイズ/.test(name))return ['腹筋','b-abs'];return ['種','b-other']}
function editSet(k,id,key,f,v){row(k,id,key)[f]=v;save()}
function complete(k,id,key){const r=row(k,id,key);r.completed=!r.completed;save();render()}
function dropHTML(k,id,i){const arr=drops(k,id,i);if(!arr.length)return '';return `<div class="dropbox open"><div class="drop-title">Set ${i+1} Drop Sets</div>${arr.map((v,j)=>`<div class="dropitem"><input inputmode="decimal" placeholder="重量 kg" value="${esc(v.weight||'')}" oninput="editDrop('${esc(k)}','${esc(id)}',${i},${j},'weight',this.value)"><input inputmode="numeric" placeholder="Rep" value="${esc(v.rep||'')}" oninput="editDrop('${esc(k)}','${esc(id)}',${i},${j},'rep',this.value)"><button onclick="removeDrop('${esc(k)}','${esc(id)}',${i},${j})">×</button></div>`).join('')}</div>`}
function setRow(k,id,i,asc=false){const key=(asc?'asc#':'main#')+i,r=row(k,id,key),done=!!r.completed;return `<div class="setrow"><div class="settop"><div class="setno">${i+1}</div><div><label>重量 kg</label><input inputmode="decimal" placeholder="0" value="${esc(r.weight||'')}" oninput="editSet('${esc(k)}','${esc(id)}','${esc(key)}','weight',this.value)"></div><div><label>Rep</label><input inputmode="numeric" placeholder="0" value="${esc(r.rep||'')}" oninput="editSet('${esc(k)}','${esc(id)}','${esc(key)}','rep',this.value)"></div><div><label>RPE</label><input inputmode="decimal" value="${esc(r.rpe||'')}" oninput="editSet('${esc(k)}','${esc(id)}','${esc(key)}','rpe',this.value)"></div></div><div class="formrow"><div><label>フォーム</label><select onchange="editSet('${esc(k)}','${esc(id)}','${esc(key)}','form',this.value)"><option value="">—</option><option ${r.form==='◎'?'selected':''}>◎</option><option ${r.form==='○'?'selected':''}>○</option><option ${r.form==='△'?'selected':''}>△</option><option ${r.form==='×'?'selected':''}>×</option></select></div><div><label>メモ</label><input value="${esc(r.memo||'')}" oninput="editSet('${esc(k)}','${esc(id)}','${esc(key)}','memo',this.value)"></div></div><div class="row-actions"><button class="complete ${done?'done':''}" onclick="complete('${esc(k)}','${esc(id)}','${esc(key)}')">${done?'✓ 完了':'セット完了'}</button>${asc?'':`<button class="drop" onclick="addDrop('${esc(k)}','${esc(id)}',${i})">ドロップ</button>`}<button class="setminus" onclick="${asc?`changeAsc('${esc(k)}','${esc(id)}',-1)`: `changeMain('${esc(k)}','${esc(id)}',-1)`}">−</button><button class="setplus" onclick="${asc?`changeAsc('${esc(k)}','${esc(id)}',1)`: `changeMain('${esc(k)}','${esc(id)}',1)`}">＋</button></div>${asc?'':dropHTML(k,id,i)}</div>`}
function exerciseCard(k,e,i){const id='ex'+i,x=ensureEx(k,i,e),count=Math.max(1,Math.min(30,Number(x.mainCount)||1)),asc=Math.max(0,Math.min(20,Number(x.ascCount)||0)),b=badge(x.name);return `<section class="exercise"><div class="exhead"><div class="exline"><div class="exname">${esc(x.name)}</div><button class="exswap" onclick="openExerciseModal('${esc(k)}','${esc(id)}')">変更</button><button class="exdelete" title="種目を閉じる" onclick="deleteExercise('${esc(k)}','${esc(id)}')">⋯</button></div><div class="rx"><strong>処方：</strong>${e.sets}セット × ${esc(e.rep)}${e.rx?'｜'+esc(e.rx):''}${e.note?'<br>'+esc(e.note):''}</div></div><div class="note-row"><input placeholder="メモを入力" value="${esc(x.note||'')}" oninput="editExerciseNote('${esc(k)}','${esc(id)}',this.value)"><button class="recent" onclick="showRecent('${esc(k)}','${esc(id)}')">最近の記録</button></div><details class="asc" ${x.ascOpen?'open':''} ontoggle="setAscOpen('${esc(k)}','${esc(id)}',this.open)"><summary>Ascending Set</summary>${Array.from({length:asc},(_,j)=>setRow(k,id,j,true)).join('')}</details><div class="section-title">MAIN SET（${count}セット）</div>${Array.from({length:count},(_,j)=>setRow(k,id,j,false)).join('')}</section>`}
function toggleDrop(k,id,i){const r=row(k,id,'main#'+i);r.dropOpen=!r.dropOpen;save();render()}function addDrop(k,id,i){drops(k,id,i).push({});row(k,id,'main#'+i).dropOpen=true;save();render()}function editDrop(k,id,i,j,f,v){drops(k,id,i)[j][f]=v;save()}function removeDrop(k,id,i,j){drops(k,id,i).splice(j,1);save();render()}
function changeMain(k,id,d){const x=session(k).exercises[id];x.mainCount=Math.max(1,Math.min(30,(Number(x.mainCount)||1)+d));save();render()}function changeAsc(k,id,d){const x=session(k).exercises[id];x.ascCount=Math.max(0,Math.min(20,(Number(x.ascCount)||0)+d));save();render()}function setAscOpen(k,id,v){session(k).exercises[id].ascOpen=!!v;save()}function editExerciseNote(k,id,v){session(k).exercises[id].note=v;save()}
function deleteExercise(k,id){const x=session(k).exercises[id];if(!x)return;x.hidden=true;save();render();toast('種目を閉じました')}
function openExerciseModal(k,id){modal={k,id,part:'脚'};document.getElementById('modalTabs').innerHTML=PARTS.map(p=>`<button class="${p===modal.part?'active':''}" onclick="modalPart('${esc(p)}')">${p}</button>`).join('');modalPart('脚');document.getElementById('exerciseModal').classList.add('show')}
function modalPart(p){modal.part=p;document.getElementById('modalTabs').innerHTML=PARTS.map(a=>`<button class="${a===p?'active':''}" onclick="modalPart('${esc(a)}')">${a}</button>`).join('');document.getElementById('exerciseChoices').innerHTML=(EXERCISES[p]||[]).map(n=>`<button onclick="replaceExercise('${esc(modal.k)}','${esc(modal.id)}','${esc(n)}')">${esc(n)}</button>`).join('')}
function closeExerciseModal(){document.getElementById('exerciseModal').classList.remove('show');modal={k:null,id:null,part:'脚'}}function replaceExercise(k,id,name){const x=session(k).exercises[id];x.name=name;save();closeExerciseModal();render();toast('種目を変更しました')}
function showRecent(k,id){const h=session(k).history||[];const rows=[];h.slice(-10).reverse().forEach(v=>{const ex=v.data?.exercises?.[id];if(ex?.sets)rows.push((v.date||'—')+'：'+Object.values(ex.sets).filter(r=>r.weight&&r.rep).map(r=>r.weight+'kg × '+r.rep).join(' / '))});alert(rows.length?rows.join('\n'):'まだ記録なし')}
function currentExercises(){let list;if(state.page==='PRE')list=[E('High-bar SQ',1,'Ascending → Top 135kg × 4〜6','Back-off：Top −5kg × 1'),E('Competition BP',1,'Ascending → Top 85kg × 4〜6','Back-off：Top −2.5kg × 1'),E('Competition DL',1,'Ascending → Top 180kg × 1','必要なら185〜190kg確認')];else if(state.page==='BBB')list=(BBB[state.bbbPart]||BBB['脚']).map(a=>E(a[0],a[1],a[2],a[3]||'',a[4]||''));else list=PPP[state.pppWeek]?.[state.pppDay]||[];const ss=session(key());return list.filter((e,i)=>!ss.exercises?.['ex'+i]?.hidden)}
function programHeader(){if(state.page==='BBB')return `<div class="panel-head"><h2>BBB　Day ${state.bbbDay}　${esc(state.bbbPart)}</h2></div><div class="tabs">${[1,2,3,4,5,6,7].map(d=>`<button class="${state.bbbDay===d?'active':''}" onclick="changeBBBDay(${d})">Day ${d}</button>`).join('')}</div><div class="tabs">${PARTS.map(p=>`<button class="${state.bbbPart===p?'active':''}" onclick="changeBBB('${esc(p)}')">${p}</button>`).join('')}</div>`;if(state.page==='PPP'){const days=Object.keys(PPP[state.pppWeek]||{});return `<div class="panel-head"><h2>PPP</h2><div class="tabs tight">${[1,2,3,4,5,6,7,8].map(w=>`<button class="${state.pppWeek===w?'active':''}" onclick="changePPPWeek(${w})">W${w}</button>`).join('')}</div><div class="tabs">${days.map(d=>`<button class="${state.pppDay===d?'active':''}" onclick="changePPPDay('${esc(d)}')">${esc(d)}</button>`).join('')}</div></div>`}return `<div class="panel-head"><h2>${state.page==='PRE'?'PRE Week 1':'Training'}</h2></div>`}
function renderProgram(){const k=key(),ex=currentExercises();document.getElementById('title').textContent=state.page==='BBB'?'BBB Day '+state.bbbDay+'　'+state.bbbPart:state.page==='PPP'?'PPP W'+state.pppWeek+' '+state.pppDay:state.page==='PRE'?'PRE Week 1':'Training';document.getElementById('app').innerHTML=`<div class="card">${programHeader()}${metaHTML(k)}${ex.map((e,i)=>exerciseCard(k,e,i)).join('')}<div class="panel-head"><label>当日メモ・特記事項</label><textarea oninput="setMeta('${esc(k)}','note',this.value)">${esc(session(k).note||'')}</textarea></div><div class="day-actions"><button class="primary" onclick="saveDay('${esc(k)}')">記録を保存</button><button class="secondary" onclick="startWork()">トレーニング開始</button><button class="secondary" onclick="restoreExercises('${esc(k)}')">閉じた種目を戻す</button></div></div>`}
function renderHome(){document.getElementById('title').textContent=new Date().getMonth()+1+'月'+new Date().getDate()+'日　トレーニング';document.getElementById('app').innerHTML=`<div class="card"><div class="panel-head"><h2>Workout Log</h2><div class="notice">処方と実績を分離。Main / Ascending / セット別Drop / BBB / PPPを一つにまとめたログ。</div><h3>プログラムから一発呼び出し</h3><div class="program-grid"><button onclick="go('PRE')">PRE Week 1</button><button onclick="state.bbbDay=1;state.bbbPart='脚';go('BBB')">BBB</button>${[1,2,3,4,5,6,7,8].map(w=>`<button onclick="state.pppWeek=${w};state.pppDay=Object.keys(PPP[${w}]||{})[0]||'D1';go('PPP')">PPP W${w}</button>`).join('')}</div><h3></h3><div class="day-actions" style="padding:0"><button class="primary" onclick="startWork()">開始</button><button class="secondary" onclick="stopWork()">停止</button><button class="secondary" onclick="resetWork()">リセット</button></div></div></div>`}
function renderHistory(){const arr=[];Object.entries(db.sessions).forEach(([k,s])=>{(s.history||[]).forEach((h,i)=>arr.push({k,s,h,i}))});arr.sort((a,b)=>b.h.savedAt-a.h.savedAt);document.getElementById('title').textContent='履歴';document.getElementById('app').innerHTML=`<div class="card"><div class="panel-head"><h2>履歴</h2><div class="small">同じ曜日・同じ種目でも、保存するたびに別ログとして残る。</div>${arr.length?arr.map((o,idx)=>`<div class="history-row"><b>${esc(o.h.label||o.k)}</b><div class="small">${esc(o.h.date||'—')}　保存：${new Date(o.h.savedAt).toLocaleString('ja-JP')}　体重 ${esc(o.h.weight||'—')}kg</div><button onclick="openHistory(${idx})">この記録を開く</button></div>`).join(''):'<div class="small" style="margin-top:10px">保存履歴なし</div>'}</div></div>`;window._history=arr}
function restoreExercises(k){Object.values(session(k).exercises||{}).forEach(x=>x.hidden=false);save();render();toast('閉じた種目を戻しました')}
function saveDay(k){const s=session(k);s.history??=[];s.history.push({savedAt:Date.now(),date:s.date,weight:s.weight,label:k,data:JSON.parse(JSON.stringify(s))});s.savedAt=Date.now();save();toast('記録を保存しました')}
function openHistory(i){const o=window._history?.[i];if(!o)return;const h=o.h.data;db.sessions[o.k]=JSON.parse(JSON.stringify(h));db.sessions[o.k].history=o.s.history||[];if(o.k.startsWith('BBB|')){const q=o.k.split('|');state.page='BBB';state.bbbDay=Number((q[1]||'D1').replace('D',''))||1;state.bbbPart=q[2]||'脚'}else if(o.k.startsWith('PPP|')){const q=o.k.split('|');state.page='PPP';state.pppWeek=Number(q[1].slice(1));state.pppDay=q[2]}else state.page='PRE';save();render();scrollTo(0,0)}
document.getElementById('restInput').onchange=()=>saveTimerSetting('rest');document.getElementById('exerciseInput').onchange=()=>saveTimerSetting('exercise');
function startWork(){if(!workStarted){workStarted=Date.now();db.workStarted=workStarted;save()}}function stopWork(){if(workStarted){workElapsed+=Date.now()-workStarted;workStarted=0;db.workStarted=0;db.workElapsed=workElapsed;save()}}function resetWork(){workStarted=0;workElapsed=0;db.workStarted=0;db.workElapsed=0;save();updateWorkClock()}function updateWorkClock(){const sec=(workElapsed+(workStarted?Date.now()-workStarted:0))/1000;document.getElementById('workClock').textContent='トレーニング '+fmtLong(sec);document.getElementById('totalDisplay').textContent=fmt(sec)}setInterval(updateWorkClock,500)
function render(){navDraw();if(state.page==='HOME')renderHome();else if(state.page==='HISTORY')renderHistory();else renderProgram();updateWorkClock()}render();

document.getElementById('restInput').onchange=()=>saveTimerSetting('rest');document.getElementById('exerciseInput').onchange=()=>saveTimerSetting('exercise');
function startWork(){if(!workStarted){workStarted=Date.now();db.workStarted=workStarted;save()}}function stopWork(){if(workStarted){workElapsed+=Date.now()-workStarted;workStarted=0;db.workStarted=0;db.workElapsed=workElapsed;save()}}function resetWork(){workStarted=0;workElapsed=0;db.workStarted=0;db.workElapsed=0;save();updateWorkClock()}function updateWorkClock(){const sec=(workElapsed+(workStarted?Date.now()-workStarted:0))/1000;document.getElementById('workClock').textContent='トレーニング '+fmtLong(sec);document.getElementById('totalDisplay').textContent=fmt(sec)}setInterval(updateWorkClock,500)
function render(){navDraw();if(state.page==='HOME')renderHome();else if(state.page==='HISTORY')renderHistory();else renderProgram();updateWorkClock()}render();
</script></body></html>
