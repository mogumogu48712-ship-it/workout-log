<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Workout Log V13</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:50;background:#111;color:#fff;padding:12px}
h1{font-size:20px;margin:0}.sub{font-size:11px;opacity:.7;margin-top:3px}
main{max-width:600px;margin:auto;padding:7px 9px 70px}
#fixedTimer{position:fixed;right:10px;bottom:10px;z-index:100;background:#111;color:#fff;border-radius:12px;padding:8px 9px;box-shadow:0 3px 14px #0003;display:none;width:min(330px,calc(100vw - 20px))}
#fixedTimer.show{display:block}.ftop{display:flex;align-items:center;justify-content:space-between;gap:8px}.ftitle{font-size:11px;font-weight:800}.timer-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.fdisplay{font-size:30px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05}.fsettings{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}.fsettings label{color:#aaa;font-size:10px}.fsettings input{padding:5px;text-align:center;background:#fff;color:#111}.factions{display:flex;gap:4px}.factions button{flex:1;border:0;border-radius:6px;padding:6px 4px;font-size:10px;font-weight:800}

.tabs{position:sticky;top:61px;z-index:40;background:#f2f2f2;padding:5px 0 8px;display:flex;gap:6px;overflow-x:auto}
.tabs button,.daytabs button,.weektabs button{white-space:nowrap;border:1px solid #ccc;background:#fff;border-radius:9px;padding:8px 11px;font-weight:750}
.tabs button.active,.daytabs button.active,.weektabs button.active{background:#111;color:#fff;border-color:#111}
.card,.exercise{background:#fff;border:1px solid #d1d1d1;border-radius:13px;margin:9px 0}
.card{padding:11px}.exercise{overflow:hidden}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:13px 0 7px}
.small{font-size:12px;color:#666}.notice{font-size:12px;line-height:1.5;background:#f7f7f7;border-radius:9px;padding:9px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
label{display:block;font-size:11px;color:#666;margin-bottom:3px}
input,select,textarea{width:100%;border:1px solid #c8c8c8;border-radius:8px;background:#fff;padding:8px}
textarea{min-height:64px;resize:vertical}
.exhead{position:relative;padding:10px;border-bottom:1px solid #ddd}
.exname{font-size:16px;font-weight:800;line-height:1.3;padding-right:45px;overflow-wrap:anywhere}
.rx{font-size:12px;color:#555;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}.rx strong{color:#111}
.timer-btn{position:absolute;right:9px;top:9px;border:1px solid #ccc;background:#f7f7f7;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:800}
.timer-panel{margin:8px;border:1px solid #d8d8d8;border-radius:10px;background:#f7f7f7;padding:8px}
.timer-panel.hidden{display:none}
.timer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.timer-cell{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px}
.timer-display{font-size:25px;font-weight:850;text-align:center;font-variant-numeric:tabular-nums;margin:3px 0 5px}
.timer-actions{display:flex;gap:5px}.timer-actions button{flex:1;border:1px solid #ccc;background:#fff;border-radius:7px;padding:6px;font-weight:750}
.timer-actions .go{background:#111;color:#fff}
.set{padding:8px 9px;border-bottom:1px solid #e8e8e8}.set:last-child{border-bottom:0}
.settop{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:6px;align-items:end}
.setno{font-size:12px;font-weight:800;padding-bottom:8px}
.set input{text-align:center;padding:7px 4px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.set-actions{display:flex;gap:5px;margin-top:5px}.set-actions button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:5px 7px;font-size:11px}
.set-actions button.done{background:#111;color:#fff}
.sectiontitle{font-size:11px;font-weight:800;color:#666;padding:8px 10px 3px}
.countctl{display:flex;align-items:center;gap:6px;margin-top:7px}
.countctl button{width:31px;height:29px;border:1px solid #ccc;background:#fff;border-radius:7px;font-weight:900}
.countctl span{font-size:12px;font-weight:750}
.replace{margin-top:7px}
.tools{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.tools button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:6px 8px;font-size:11px}
.ascbox{margin:8px;border:1px solid #bbb;border-radius:10px;background:#fafafa;overflow:hidden}
.asctop{display:grid;grid-template-columns:1fr auto 30px 30px;gap:5px;align-items:center;padding:8px 9px;background:#eee;border-bottom:1px solid #ddd;font-size:12px}
.asctop button{width:30px;height:28px;border:1px solid #ccc;background:#fff;border-radius:7px;font-weight:900}
.dropbox{padding:3px 9px 8px}.dropitem{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;margin-top:5px}.dropadd{margin-top:6px;border:1px solid #ccc;background:#fff;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:750}
.dropitem button{border:1px solid #ccc;background:#fff;border-radius:7px}
.daytabs,.weektabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:7px}
.action{display:flex;gap:7px;margin-top:9px}.action button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#e7e7e7}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 7px;font-size:11px;margin:2px}
.history-item{border-top:1px solid #eee;padding:9px 0}.history-item:first-child{border-top:0}
.workbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}.worktime{font-variant-numeric:tabular-nums;font-weight:800}.workbar button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 8px;font-size:11px}
@media(max-width:390px){.meta{grid-template-columns:1fr 1fr}.settop{grid-template-columns:36px 1fr 1fr 1fr}.set input{font-size:14px}.timer-grid{grid-template-columns:1fr}}
.exercise-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.exercise-actions button{flex:1 1 auto;border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 8px;font-size:11px;font-weight:800}
.complete-btn{margin-top:7px;border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:800;width:100%}
.complete-btn.done{background:#111;color:#fff}
</style>
</head>
<body>
<header><h1>Workout Log</h1><div class="sub">Power Building｜PRE → BBB → PPP W1〜W8 → TEST</div></header>
<main><div id="tabs" class="tabs"></div><div id="app"></div></main>
<div id="fixedTimer">
 <div class="ftop"><span class="ftitle" id="ftitle">種目タイマー</span><button onclick="closeFixedTimer()" style="border:0;border-radius:6px;padding:3px 6px">×</button></div>
 <div class="timer-name" id="ftname">—</div>
 <div class="fdisplay" id="fdisplay">02:00</div>
 <div class="fsettings">
  <label>セット間 <input id="frest" type="number" min="0" max="900" step="5"></label>
  <label>種目間 <input id="fexercise" type="number" min="0" max="900" step="5"></label>
 </div>
 <div class="factions"><button onclick="startFixedTimer('rest')">セット間 ▶</button><button onclick="startFixedTimer('exercise')">種目間 ▶</button><button onclick="stopFixedTimer()">■</button><button onclick="resetFixedTimer()">↺</button></div>
</div>
<script>
"use strict";
const TABS=["HOME","PRE","BBB","PPP W1","PPP W2","PPP W3","PPP W4","PPP W5","PPP W6","PPP W7","PPP W8","HISTORY"];
const BBB={
"Legs":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"Chest":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"Shoulders":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"Back":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"Arms":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""],["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]]
};
const PARTS={
"脚":["バーベルスクワット","ハックスクワット","レッグプレス","レッグエクステンション","レッグカール","ブルガリアンスクワット","RDL","カーフレイズ"],
"胸":["ベンチプレス","インクラインベンチプレス","ダンベルベンチプレス","ダンベルフライ","チェストプレスマシン","ディップチンアシスト"],
"背中":["デッドリフト","トップサイドデッドリフト","ベントオーバーロウ","Tバーロウマシン","シーテッドロー","ラットプルダウン","ワイドグリップTバーロウ"],
"肩":["OHP","スミスバックプレス","ケーブルアップライトロウ","ダンベルサイドレイズ","リアデルトフライ","ショルダープレスマシン"],
"三頭":["クローズグリップベンチ","JMプレス","スミスOHエクステンション","ナローベンチ","ライイングトライセプスエクステンション"],
"二頭":["バーベルカール","ケーブルカール","プリーチャーカール","ダンベルカール"],
"前腕":["リストカール","リバースリストカール","ハンマーカール","リストローラー"],
"腹筋":["アブローラー","ケーブルクランチ","ハンギングレッグレイズ","アブドミナルマシン"]
};
const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
const P={};
for(let w=1;w<=4;w++)P["PPP W"+w]={
D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],
D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],
D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],
D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],
D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7","低疲労")]
};
P["PPP W5"]={D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]};
P["PPP W6"]={D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]};
P["PPP W7"]={D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],D2:[E("Competition DL",3,"1","70〜75%")],D3:[E("Competition BP",2,"3","75%")]};
P["PPP W8"]={"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]};
const PRE=[["High-bar SQ","Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"],["Competition BP","Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"],["Competition DL","Ascending → Top 180kg × 1","必要なら185〜190kg確認"]];

let current=localStorage.getItem("pbCurrentV13")||"HOME";
let store=JSON.parse(localStorage.getItem("pbWorkoutV13")||"{}");
let bbbDay=localStorage.getItem("pbBBBDayV13")||"Legs";
let timers={};
let workIntervals={};
let openTimers=JSON.parse(localStorage.getItem("pbOpenTimersV13")||"{}");

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const get=k=>(store[k]??={sets:{},exercises:{},timer:{rest:120,exercise:300}});
const save=()=>localStorage.setItem("pbWorkoutV13",JSON.stringify(store));
const tabs=document.getElementById("tabs"),app=document.getElementById("app");

function go(t){current=t;localStorage.setItem("pbCurrentV13",t);drawTabs();render();scrollTo(0,0)}
function drawTabs(){tabs.innerHTML=TABS.map(t=>`<button class="${t===current?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}

function meta(k){
 const d=get(k);
 return `<div class="meta">
 <div><label>日付</label><input type="date" data-meta="${esc(k)}" data-f="date" value="${esc(d.date||"")}"></div>
 <div><label>体重 kg（任意）</label><input inputmode="decimal" data-meta="${esc(k)}" data-f="weight" value="${esc(d.weight||"")}"></div>
 </div>
 <div class="meta"><div><label>睡眠</label><div class="tools">${[1,2,3,4,5].map(n=>`<button onclick="setMetaNum('${esc(k)}','sleep',${n})">${n}${d.sleep==n?" ✓":""}</button>`).join("")}</div></div>
 <div><label>疲労</label><div class="tools">${[1,2,3,4,5].map(n=>`<button onclick="setMetaNum('${esc(k)}','fatigue',${n})">${n}${d.fatigue==n?" ✓":""}</button>`).join("")}</div></div></div>`;
}
function setMetaNum(k,f,n){get(k)[f]=n;save();render()}

function row(k,id,i,r){
 const d=get(k),key=id+"#"+i,r2=r||{};
 return `<div class="set"><div class="settop"><div class="setno">Set ${i+1}</div>
 <div><label>重量 kg</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="weight" value="${esc(r2.weight||"")}"></div>
 <div><label>Rep</label><input inputmode="numeric" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rep" value="${esc(r2.rep||"")}"></div>
 <div><label>RPE</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rpe" value="${esc(r2.rpe||"")}"></div></div>
 <div class="formrow"><div><label>フォーム</label><select data-row="${esc(k)}" data-id="${esc(key)}" data-f="form"><option value="">—</option><option ${r2.form=="◎"?"selected":""}>◎</option><option ${r2.form=="○"?"selected":""}>○</option><option ${r2.form=="△"?"selected":""}>△</option><option ${r2.form=="×"?"selected":""}>×</option></select></div>
 <div><label>メモ</label><input data-row="${esc(k)}" data-id="${esc(key)}" data-f="memo" value="${esc(r2.memo||"")}"></div></div>
 <button class="complete-btn ${r2.completed?"done":""}" onclick="completeSet('${esc(k)}','${esc(id)}',${i},this)">${r2.completed?"✓ 完了":"✓ セット完了"}</button></div>`;
}
function dropRows(k,id,i){
 const d=get(k), key=id+"#"+i+"#drops", arr=d.sets[key]||[];
 return `<div class="dropbox"><div class="small"><b>Drop Set</b></div>
 ${arr.map((r,j)=>`<div class="dropitem"><input inputmode="decimal" placeholder="重量 kg" data-row="${esc(k)}" data-id="${esc(key)}#${j}" data-f="weight" value="${esc(r.weight||"")}"><input inputmode="numeric" placeholder="Rep" data-row="${esc(k)}" data-id="${esc(key)}#${j}" data-f="rep" value="${esc(r.rep||"")}"><button onclick="removeDrop('${esc(k)}','${esc(id)}',${i},${j})">×</button></div>`).join("")}
 <button class="dropadd" onclick="addDrop('${esc(k)}','${esc(id)}',${i})">＋ Drop Set追加</button></div>`;
}
function timerPanel(k,id){
 const d=get(k), t=d.exercises[id]?.timer||{rest:120,exercise:300};
 const key=esc(id);
 return `<div id="tp-${key}" class="timer-panel ${openTimers[id]?"":"hidden"}">
 <div class="timer-grid">
 <div class="timer-cell"><label>セット間休憩</label><input type="number" min="0" max="900" step="5" value="${Number(t.rest||0)}" onchange="setTimerValue('${esc(k)}','rest',this.value)"><div id="td-${key}-rest" class="timer-display">--:--</div><div class="timer-actions"><button class="go" onclick="startRest('${esc(k)}','${key}','rest')">▶ Start</button><button onclick="stopTimer('${key}','rest')">■</button></div></div>
 <div class="timer-cell"><label>種目間休憩</label><input type="number" min="0" max="900" step="5" value="${Number(t.exercise||0)}" onchange="setTimerValue('${esc(k)}','exercise',this.value)"><div id="td-${key}-exercise" class="timer-display">--:--</div><div class="timer-actions"><button class="go" onclick="startRest('${esc(k)}','${key}','exercise')">▶ Start</button><button onclick="stopTimer('${key}','exercise')">■</button></div></div>
 </div></div>`;
}
function exerciseCard(k,e,index,opts={}){
 const d=get(k), base=e.name, id=(opts.prefix||"EX")+"|"+index+"|"+base.replace(/[|#]/g,"_");
 d.exercises[id]??={};
 const excfg=d.exercises[id];
 excfg.timer??={rest:120,exercise:300};
 const ascKey=id+"#asc", ascCount=Math.max(1,Math.min(15,Number(d.exercises[ascKey]?.count??3)));
 const custom=d.exercises[id]||{};
 const name=custom.name||base;
 const count=custom.count??e.sets;
 let rows="";
 for(let i=0;i<count;i++)rows+=row(k,id,i,d.sets[id+"#"+i]||{})+dropRows(k,id,i);
 return `<div class="exercise"><div class="exhead"><div class="exname">${esc(name)}</div><button class="timer-btn" onclick="openExerciseTimer('${esc(k)}','${esc(id)}')">⏱</button>
 <div class="rx"><strong>処方：</strong>${count}セット × ${esc(e.rep)}${e.rx?"｜"+esc(e.rx):""}${e.note?"<br>"+esc(e.note):""}</div>
 ${opts.bbb?replaceUI(k,id,base):""}${opts.bbb?`<div class="countctl"><button onclick="changeCount('${esc(k)}','${esc(id)}',-1)">−</button><span>Main ${count}セット</span><button onclick="changeCount('${esc(k)}','${esc(id)}',1)">＋</button></div>`:""}
 <div class="tools exercise-actions">
  <button onclick="changeCount('${esc(k)}','${esc(id)}',-1)">−セット</button>
  <button onclick="changeCount('${esc(k)}','${esc(id)}',1)">＋セット</button>
  <button onclick="openExerciseTimer('${esc(k)}','${esc(id)}')">⏱ 時計</button>
  <button onclick="addDrop('${esc(k)}','${esc(id)}',${Math.max(0,count-1)})">＋Drop</button>
  <button onclick="copyPrevious('${esc(k)}','${esc(id)}',${count})">前回</button>
</div></div>
 <div class="ascbox"><div class="asctop"><b>Ascending Set</b><span>${ascCount}セット</span><button onclick="changeAscCount('${esc(k)}','${esc(id)}',-1)">−</button><button onclick="changeAscCount('${esc(k)}','${esc(id)}',1)">＋</button></div>
 ${Array.from({length:ascCount},(_,i)=>row(k,ascKey,i,d.sets[ascKey+"#"+i]||{})).join("")}</div>
 <div class="sectiontitle">Main Set</div>${rows}</div>`;
}
function replaceUI(k,id,base){
 const d=get(k), custom=d.exercises[id]||{}, part=custom.part||"脚";
 const opts=PARTS[part]||[];
 return `<div class="replace"><label>種目差し替え</label><select onchange="replaceExercise('${esc(k)}','${esc(id)}',this.value,'${esc(part)}')"><option value="">部位を選択：${esc(part)}</option>${Object.keys(PARTS).map(x=>`<option value="${esc(x)}" ${x===part?"selected":""}>${esc(x)}</option>`).join("")}</select><select onchange="setExerciseName('${esc(k)}','${esc(id)}',this.value)"><option value="">種目を選択</option>${opts.map(x=>`<option ${x===custom.name?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`;
}
function bbbCard(k,x,i){
 const e={name:x[0],sets:x[1],rep:x[2]};
 const id="EX|"+i+"|"+e.name.replace(/[|#]/g,"_");
 const d=get(k), custom=d.exercises[id]||{};
 if(!custom.part)custom.part=(["Legs","Chest","Shoulders","Back","Arms"].includes(bbbDay)?({Legs:"脚",Chest:"胸",Shoulders:"肩",Back:"背中",Arms:"三頭"}[bbbDay]):"脚");
 if(!custom.name)custom.name=e.name;
 d.exercises[id]=custom;save();
 return exerciseCard(k,e,i,{bbb:true});
}
function renderBBB(){
 const days=[["月","Legs"],["水","Chest"],["木","Shoulders"],["土","Back"],["日","Arms"]];
 const pair=days.find(x=>x[1]===bbbDay)||days[0],k="BBB|"+pair[1];
 app.innerHTML=`<div class="card"><h2>BBB</h2><div class="daytabs">${days.map(x=>`<button class="${x[1]===bbbDay?"active":""}" onclick="setBBBDay('${x[1]}')">${x[0]} ${x[1]}</button>`).join("")}</div>${meta(k)}</div>
 <div class="card"><h2>${pair[0]}：${pair[1]}</h2><div class="workbar">${workbar(k)}</div>${BBB[pair[1]].map((x,i)=>bbbCard(k,x,i)).join("")}${end(k)}</div>`;
}
function workbar(k){
 const d=get(k),sec=Math.floor(d.workSeconds||0),running=!!workIntervals[k];
 return `<span class="worktime" id="wt-${esc(k)}">${fmt(sec)}</span><button onclick="startWork('${esc(k)}')">▶開始</button><button onclick="stopWork('${esc(k)}')">■停止</button><button onclick="resetWork('${esc(k)}')">↺</button>`;
}
function end(k){const d=get(k);return `<label>当日メモ・特記事項</label><textarea data-note="${esc(k)}">${esc(d.note||"")}</textarea><div class="action"><button class="primary" onclick="commit('${esc(k)}')">保存</button><button class="secondary" onclick="resetDay('${esc(k)}')">リセット</button></div>`}
function renderPPP(){
 const days=Object.keys(P[current]||{}), week=current;
 app.innerHTML=`<div class="card"><h2>${esc(week)}</h2><div class="daytabs">${days.map(day=>`<button onclick="document.getElementById('day-${esc(day)}')?.scrollIntoView({behavior:'smooth'})">${esc(day)}</button>`).join("")}</div></div>`+
 days.map(day=>{const k=week+"|"+day;return `<div class="card" id="day-${esc(day)}"><h2>${esc(day)}</h2>${meta(k)}<div class="workbar">${workbar(k)}</div>${P[week][day].map((e,i)=>exerciseCard(k,e,i)).join("")}${end(k)}</div>`}).join("");
}
function renderPRE(){const k="PRE|D1";app.innerHTML=`<div class="card"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなく、BBB初期重量・フォーム・動作を校正。</div>${meta(k)}${PRE.map((x,i)=>exerciseCard(k,{name:x[0],sets:1,rep:x[1],rx:x[2]},i,{})).join("")}${end(k)}</div>`}
function renderHome(){app.innerHTML=`<div class="card"><h2>Workout Log</h2><div class="notice">処方と実績を分離。種目ごとにセット記録・休憩タイマー・ドロップセット・トレーニング時間を管理。</div><h3>プログラム</h3><span class="badge">PRE</span><span class="badge">BBB</span><span class="badge">PPP W1〜W8</span><h3>現在</h3><div class="meta"><div><label>Week</label><select onchange="go(this.value)"><option>HOME</option>${TABS.slice(1,-1).map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>日付</label><input type="date" onchange="localStorage.setItem('pbHomeDateV13',this.value)"></div></div></div>`}
function renderHistory(){const arr=Object.entries(store).filter(x=>x[1].savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);app.innerHTML=`<div class="card"><h2>履歴</h2><div class="small">保存はこの端末のブラウザ内。</div>${arr.length?arr.map(([k,v])=>`<div class="history-item"><b>${esc(k)}</b><div class="small">${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg</div></div>`).join(""):"<div class='small' style='margin-top:8px'>保存履歴なし</div>"}</div>`}
function render(){if(current==="HOME")renderHome();else if(current==="PRE")renderPRE();else if(current==="BBB")renderBBB();else if(current==="HISTORY")renderHistory();else renderPPP();bind();syncWorkBars()}

function bind(){
 document.querySelectorAll("[data-meta]").forEach(x=>x.oninput=()=>{get(x.dataset.meta)[x.dataset.f]=x.value;save()});
 document.querySelectorAll("[data-note]").forEach(x=>x.oninput=()=>{get(x.dataset.note).note=x.value;save()});
 document.querySelectorAll("[data-row]").forEach(x=>x.oninput=()=>{const d=get(x.dataset.row);d.sets[x.dataset.id]??={};d.sets[x.dataset.id][x.dataset.f]=x.value;save()});
}
function toggleDone(k,id){const d=get(k);d.sets[id]??={};d.sets[id].done=!d.sets[id].done;save();render()}
function setBBBDay(v){bbbDay=v;localStorage.setItem("pbBBBDayV13",v);render()}
function changeCount(k,id,delta){const d=get(k),e=d.exercises[id]??={count:1};e.count=Math.max(1,Math.min(30,(e.count??1)+delta));save();render()}
function replaceExercise(k,id,val,part){if(!val)return;const d=get(k);d.exercises[id]??={};d.exercises[id].part=val;d.exercises[id].name=(PARTS[val]||[])[0]||"";save();render()}
function setExerciseName(k,id,name){if(!name)return;const d=get(k);d.exercises[id]??={};d.exercises[id].name=name;save();render()}
function completeSet(k,id,i,btn){const d=get(k),key=id+"#"+i;d.sets[key]??={};d.sets[key].completed=!d.sets[key].completed;save();btn.classList.toggle("done",!!d.sets[key].completed);btn.textContent=d.sets[key].completed?"✓ 完了":"✓ セット完了"}
function addDrop(k,id,i){const d=get(k),key=id+"#"+i+"#drops";d.sets[key]??=[];d.sets[key].push({});save();render()}
function removeDrop(k,id,i,j){const d=get(k),key=id+"#"+i+"#drops",a=d.sets[key]||[];a.splice(j,1);save();render()}
function changeAscCount(k,id,delta){const d=get(k),key=id+"#asc";d.exercises[key]??={count:3};d.exercises[key].count=Math.max(1,Math.min(15,(d.exercises[key].count??3)+delta));save();render()}
function copyPrevious(k,id,count){const d=get(k),hist=Object.entries(store).filter(([kk,v])=>kk!==k&&v.savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt)[0];if(!hist)return alert("前回保存ログがありません");const src=hist[1].sets||{};for(let i=0;i<count;i++)d.sets[id+"#"+i]={...(src[id+"#"+i]||{})};save();render()}
function commit(k){get(k).savedAt=Date.now();save();alert("保存しました")}
function resetDay(k){if(confirm("この日の入力をリセットしますか？")){delete store[k];save();render()}}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function timerKey(id,type){return id+"|"+type}
function openExerciseTimer(k,id){
 stopFixedTimer();
 const d=get(k), ex=d.exercises[id]??={};
 ex.timer??={rest:120,exercise:300};
 window.fixedTimer={k,id,type:"rest"};
 const box=document.getElementById("fixedTimer");
 box.classList.add("show");
 document.getElementById("ftname").textContent=ex.name||id.split("|").slice(-1)[0];
 document.getElementById("frest").value=Number(ex.timer.rest||0);
 document.getElementById("fexercise").value=Number(ex.timer.exercise||0);
 document.getElementById("fdisplay").textContent=fmt(Number(ex.timer.rest||0));
 document.getElementById("frest").onchange=()=>saveFixedTimerValue("rest");
 document.getElementById("fexercise").onchange=()=>saveFixedTimerValue("exercise");
}
function saveFixedTimerValue(type){
 const f=window.fixedTimer;if(!f)return;
 const el=document.getElementById(type==="rest"?"frest":"fexercise");
 const v=Math.max(0,Math.min(900,Number(el.value)||0));
 const d=get(f.k);d.exercises[f.id]??={};d.exercises[f.id].timer??={rest:120,exercise:300};
 d.exercises[f.id].timer[type]=v;save();
 if(!timers[timerKey(f.id,type)])document.getElementById("fdisplay").textContent=fmt(v);
}
function startRest(k,id,type){
 stopTimer(id,type);
 const d=get(k), ex=d.exercises[id]||{}, seconds=Math.max(0,Math.min(900,Number(ex.timer?.[type]||0)));
 if(seconds<=0)return;
 window.fixedTimer={k,id,type};
 showFixedTimer(k,id,type);
 const key=timerKey(id,type),end=Date.now()+seconds*1000;
 timers[key]={end};
 const tick=()=>{
  const left=Math.max(0,Math.ceil((timers[key].end-Date.now())/1000));
  const el=document.getElementById("fdisplay");if(el)el.textContent=fmt(left);
  if(left<=0){clearTimeout(timers[key].iv);delete timers[key];beep();}
  else timers[key].iv=setTimeout(tick,250);
 };
 tick();
}
function showFixedTimer(k,id,type){
 const d=get(k),ex=d.exercises[id]||{},t=ex.timer||{rest:120,exercise:300};
 document.getElementById("fixedTimer").classList.add("show");
 document.getElementById("ftitle").textContent=type==="rest"?"セット間休憩":"種目間休憩";
 document.getElementById("ftname").textContent=ex.name||id.split("|").slice(-1)[0];
 document.getElementById("frest").value=Number(t.rest||0);
 document.getElementById("fexercise").value=Number(t.exercise||0);
 document.getElementById("fdisplay").textContent=fmt(Number(t[type]||0));
 document.getElementById("frest").onchange=()=>saveFixedTimerValue("rest");
 document.getElementById("fexercise").onchange=()=>saveFixedTimerValue("exercise");
}
function closeFixedTimer(){stopFixedTimer();document.getElementById("fixedTimer").classList.remove("show");window.fixedTimer=null}
function startFixedTimer(type){
 const f=window.fixedTimer;if(!f)return;
 if(type)saveFixedTimerValue(type);
 const useType=type||f.type||"rest";
 startRest(f.k,f.id,useType);
}
function stopFixedTimer(){const f=window.fixedTimer;if(!f)return;stopTimer(f.id,"rest");stopTimer(f.id,"exercise")}
function resetFixedTimer(){
 const f=window.fixedTimer;if(!f)return;
 stopFixedTimer();
 const d=get(f.k),t=d.exercises[f.id]?.timer||{rest:120,exercise:300};
 document.getElementById("fdisplay").textContent=fmt(Number(t[f.type||"rest"]||0));
}
function stopTimer(id,type){const key=timerKey(id,type);if(timers[key]){clearTimeout(timers[key].iv);delete timers[key]}}
function startWork(k){if(workIntervals[k])return;const d=get(k);d.workStartedAt=d.workStartedAt||Date.now()-Number(d.workSeconds||0)*1000;workIntervals[k]=setInterval(()=>{d.workSeconds=Math.floor((Date.now()-d.workStartedAt)/1000);const el=document.getElementById("wt-"+k);if(el)el.textContent=fmt(d.workSeconds);save()},1000)}
function stopWork(k){if(workIntervals[k]){clearInterval(workIntervals[k]);delete workIntervals[k];get(k).workStartedAt=null;save();syncWorkBars()}}
function resetWork(k){if(workIntervals[k]){clearInterval(workIntervals[k]);delete workIntervals[k]}const d=get(k);d.workSeconds=0;d.workStartedAt=null;save();syncWorkBars()}
function syncWorkBars(){Object.keys(workIntervals).forEach(k=>{const el=document.getElementById("wt-"+k);if(el)el.textContent=fmt(get(k).workSeconds||0)})}

drawTabs();render();
</script>
</body>
</html>
