<style>

details.asc{border-top:1px solid #e2e2e2;padding:0 10px 8px}

.sectiontitle{padding:9px 10px 0;font-size:12px;font-weight:800;color:#555;background:#fafafa}
.replace{display:grid;grid-template-columns:42px 1fr;gap:4px 6px;margin-top:7px;padding-right:0}.replace label{font-size:10px;margin:0;align-self:center}.replace select{padding:5px 7px;font-size:11px}
.countctl{display:flex;align-items:center;gap:7px;margin-top:8px}.countctl button{border:1px solid #ccc;background:#fff;border-radius:8px;width:36px;height:32px;font-size:19px;font-weight:800}.countctl span{min-width:72px;text-align:center;font-weight:800}
.worktimer{background:#f7f7f7;border-radius:10px;padding:9px;margin:9px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.workclock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.worktimer button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 9px;font-weight:700}
.history-item{cursor:pointer}.history-item:active{background:#eee}
.history-date{font-weight:800}.history-sub{font-size:12px;color:#666;margin-top:4px}
@media(max-width:420px){
 .exname,.rx{padding-right:0}
}
@media(max-width:380px){.settop{grid-template-columns:36px 1fr 1fr 1fr}.set input{font-size:14px}}
</style>

.setdone,.dropbtn,.clockbtn{border:1px solid #ccc;background:#f5f5f5;border-radius:7px;padding:7px 8px;font-weight:800;font-size:11px}
.setdone.done{background:#111;color:#fff}
.set.drop{background:#f7f7f7;border-left:3px solid #555}.set.extra{background:#fafafa}
.dropbtn{background:#fff}.clockbtn{min-width:38px}
.set-control{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #ddd;background:#fafafa}
.set-control button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 12px;font-weight:800}
.drop-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 0;font-size:11px;color:#666}
.drop-delete{border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 7px;font-size:10px}
.timer-tray{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid #bbb;padding:7px max(9px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));box-shadow:0 -2px 8px rgba(0,0,0,.08);display:none}

.timer-name{font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.timer-tray button.primary-t{background:#111;color:#fff}
.settag{font-size:10px;font-weight:800;color:#666;margin-bottom:4px}
.exercise-note{padding:8px 10px;border-top:1px solid #ddd}.exercise-note input{font-size:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px}.summary .stat{background:#f7f7f7;border-radius:9px;padding:9px}
.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:#666}

<body>
<header><h1>Workout Log</h1><p>Power Building｜PRE → BBB → PPP W1〜W8 → TEST</p></header>
<main><nav id="nav"></nav><div id="app"></div></main>
<div id="timerTray" class="timer-tray"></div>

<script>
const tabs=["HOME","PRE","BBB","PPP","HISTORY"];
const BBB={
"Legs":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"Chest":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"Shoulders":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"Back":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"Arms":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""],["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]]
};
const EXLIB={
"脚":["バーベルスクワット","ハイバースクワット","ローバースクワット","フロントスクワット","ブルガリアンスクワット","ハックスクワット","レッグプレス","レッグエクステンション","レッグカール","RDL","スティッフレッグデッドリフト"],
"胸":["ベンチプレス","ポーズベンチプレス","ラーセンベンチ","インクラインベンチプレス","ダンベルベンチプレス","ダンベルフライ","チェストプレスマシン","ディップス"],
"背中":["デッドリフト","トップサイドデッドリフト","ベントオーバーロウ","ワンハンドロウ","Tバーロウマシン","シーテッドロー","ラットプルダウン","ワイドグリップTバーロウ"],
"肩":["OHP","スミスバックプレス","ダンベルショルダープレス","ショルダープレスマシン","ダンベルサイドレイズ","ケーブルアップライトロウ","リアデルトフライ","フェイスプル"],
"三頭":["クローズグリップベンチ","JMプレス","スミスOHエクステンション","ライイングトライセプスエクステンション","ローププレスダウン","ディップス"],
"二頭":["バーベルカール","EZバーカール","ダンベルカール","インクラインカール","ケーブルカール","プリーチャーカール","ハンマーカール"],
"前腕":["リストカール","リバースリストカール","リバースカール","ハンマーカール","ケーブルリストカール"],
"腹筋":["アブローラー","ケーブルクランチ","マシンクランチ","ハンギングレッグレイズ","レッグレイズ","プランク"]
};
const BODYFOR={
"Legs":"脚","Chest":"胸","Shoulders":"肩","Back":"背中",
"Arms":"三頭"
};
const PRE=[
["High-bar SQ","Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"],
["Competition BP","Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"],
["Competition DL","Ascending → Top 180kg × 1","必要なら185〜190kg確認"]
];
const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
const P={};
for(let w=1;w<=4;w++)P["PPP W"+w]={
D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],
D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],
D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],
D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],
D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7","低疲労")]
};
P["PPP W5"]={D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]};
P["PPP W6"]={D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]};
P["PPP W7"]={D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],D2:[E("Competition DL",3,"1","70〜75%")],D3:[E("Competition BP",2,"3","75%")]};
P["PPP W8"]={"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]};

let current="HOME";
let bbbDay=localStorage.getItem("bbbDay")||"Legs";
let selectedWeek=localStorage.getItem("selectedWeek")||"PPP W1";
let selectedDay=localStorage.getItem("selectedDay")||"D1";
let activeSession=null;
let store=JSON.parse(localStorage.getItem("pbWorkoutV6")||"{}");
let runtime={};
let workout={elapsed:0,running:false,interval:null};

const nav=document.getElementById("nav"),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
const today=()=>new Date().toISOString().slice(0,10);

function beep(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=new C(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;g.gain.value=.16;o.connect(g);g.connect(c.destination);
  o.start();o.stop(c.currentTime+.22);
 }catch(e){}
}
function sessionKey(type,day,date){return type+"|"+day+"|"+date}
function newSession(type,day){
 const date=today(),key=sessionKey(type,day,date);
 activeSession=key;
 if(!store[key])store[key]={type,day,date,sets:{},rest:{},exerciseRest:{},counts:{},note:"",weight:"",sleep:"",fatigue:"",elapsed:0,savedAt:null};
 save();resetRuntime();workout.elapsed=store[key].elapsed||0;
}
function getSession(){
 if(!activeSession){newSession(current==="BBB"?"BBB":current==="PRE"?"PRE":selectedWeek, current==="BBB"?bbbDay:current==="PRE"?"D1":selectedDay)}
 return store[activeSession];
}
function save(){localStorage.setItem("pbWorkoutV6",JSON.stringify(store))}
function resetRuntime(){Object.values(runtime).forEach(t=>{if(t.interval)clearInterval(t.interval)});runtime={}}
function timerKey(id,type){return id+"|"+type}
function timer(id,type,seconds){
 const key=timerKey(id,type);
 if(!runtime[key])runtime[key]={left:Math.max(0,Number(seconds)||0),running:false,interval:null};
 return runtime[key];
}
function timerSettings(id){
 const s=getSession();s.rest??={};s.exerciseRest??={};
 return {rest:Math.max(0,Number(s.rest[id]??90)||0),exercise:Math.max(0,Number(s.exerciseRest[id]??180)||0)};
}
function startTimer(id,type){
 const set=timerSettings(id),t=timer(id,type,set[type]);
 if(t.running)return;
 if(t.left<=0)t.left=set[type];
 t.running=true;
 clearInterval(t.interval);
 t.interval=setInterval(()=>{
   t.left=Math.max(0,t.left-1);
   if(t.left===0){
     clearInterval(t.interval);t.interval=null;t.running=false;beep();
   }
   updateTimerTray();
 },1000);
 updateTimerTray();
}
function pauseTimer(id,type){
 const t=timer(id,type,0);
 if(t.interval)clearInterval(t.interval);
 t.interval=null;t.running=false;updateTimerTray();
}
function resetTimer(id,type,seconds){
 pauseTimer(id,type);
 timer(id,type,0).left=Math.min(900,Math.max(0,Number(seconds)||0));
 updateTimerTray();
}
function setTimerSetting(id,type,v){
 const n=Math.min(900,Math.max(0,Number(v)||0)),s=getSession();
 if(type==="rest"){s.rest??={};s.rest[id]=n}else{s.exerciseRest??={};s.exerciseRest[id]=n}
 save();resetTimer(id,type,n);selectTimer(id);
}
let timerExercise=null;
function selectTimer(id){
 timerExercise=id;
 const tray=document.getElementById("timerTray");
 if(tray){tray.classList.add("open");updateTimerTray()}
}
function closeTimer(){
 timerExercise=null;
 const tray=document.getElementById("timerTray");if(tray)tray.classList.remove("open");
}
function timerForSet(exId,setId){
 selectTimer(exId);
}
function updateTimerTray(){
 const tray=document.getElementById("timerTray");
 if(!tray)return;
 if(!timerExercise){tray.classList.remove("open");return}
 const id=timerExercise,set=timerSettings(id);
 const r=timer(id,"rest",set.rest),x=timer(id,"exercise",set.exercise);
 const active=r.running?"rest":x.running?"exercise":null;
 const left=active==="rest"?r.left:active==="exercise"?x.left:r.left;
 const title=id.split("|").slice(-1)[0];
 tray.innerHTML=`<div class="timer-tray-inner">
   <div><div class="timer-name">${esc(title)}｜${active==="rest"?"セット間":"種目間"}</div>
   <div id="timerClock" class="timer-clock">${fmt(left)}</div></div>
   <button class="primary-t" onclick="startTimer('${esc(id)}','rest')">SET</button>
   <button onclick="startTimer('${esc(id)}','exercise')">種目</button>
   <button onclick="pauseTimer('${esc(id)}','rest')">停止</button>
   <button onclick="resetTimer('${esc(id)}','rest',${set.rest})">リセット</button>
   <button onclick="closeTimer()">閉じる</button>
 </div>
 <div class="mini-settings" style="max-width:540px;margin:6px auto 0">
   <input type="number" min="0" max="900" value="${set.rest}" onchange="setTimerSetting('${esc(id)}','rest',this.value)" placeholder="セット間秒">
   <input type="number" min="0" max="900" value="${set.exercise}" onchange="setTimerSetting('${esc(id)}','exercise',this.value)" placeholder="種目間秒">
 </div>`;
 tray.classList.add("open");
}
function exerciseTimerButton(id){
 const set=timerSettings(id),r=timer(id,"rest",set.rest),x=timer(id,"exercise",set.exercise);
 const running=r.running||x.running;
 return `<button class="clockbtn ${running?"running":""}" title="タイマー" onclick="timerForSet('${esc(id)}','')">🕰️</button>`;
}
function meta(){
 const s=getSession();return `<div class="meta">
  <div><label>日付</label><input type="date" value="${esc(s.date)}" onchange="changeSessionDate(this.value)"></div>
  <div><label>体重 kg（任意）</label><input inputmode="decimal" value="${esc(s.weight)}" oninput="setMeta('weight',this.value)"></div>
 </div>
 <div class="meta">
  <div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.sleep==n?"on":""}" onclick="setMeta('sleep',${n})">${n}</button>`).join("")}</div></div>
  <div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.fatigue==n?"on":""}" onclick="setMeta('fatigue',${n})">${n}</button>`).join("")}</div></div>
 </div>`
}
function setMeta(f,v){getSession()[f]=v;save();render()}
function changeSessionDate(date){
 const old=getSession(),type=old.type,day=old.day,newKey=sessionKey(type,day,date);
 if(newKey!==activeSession){
  if(store[newKey]){activeSession=newKey}
  else{store[newKey]={...old,date,savedAt:null};delete store[activeSession];activeSession=newKey}
  save()
 }
 render()
}
function setField(id,f,v){const s=getSession();s.sets??={};s.sets[id]??={};s.sets[id][f]=v;save()}
function exerciseList(k){
 if(k==="BBB")return BBB[bbbDay]||[];
 if(k==="PRE")return PRE;
 return P[selectedWeek]?.[selectedDay]||[];
}
function exerciseOverrideKey(k,idx){return k+"|"+idx}
function exerciseFor(k,e,idx){
 const s=getSession();s.exerciseNames??={};
 const name=s.exerciseNames[exerciseOverrideKey(k,idx)]||((Array.isArray(e)?e[0]:e.name));
 const rep=Array.isArray(e)?e[2]:e.rep;
 const sets=Array.isArray(e)?e[1]:e.sets;
 const body=s.exerciseBodies?.[exerciseOverrideKey(k,idx)]|| (Array.isArray(e)?(BODYFOR[bbbDay]||"胸"):(e.body||BODYFOR[k]||"胸"));
 return {name,rep,sets,rx:Array.isArray(e)?"":e.rx,note:Array.isArray(e)?"":e.note,body};
}
function changeExerciseBody(k,idx,body){
 const next=EXLIB[body]?.[0];if(next)replaceExercise(k,idx,next,body);
}
function replaceExercise(k,idx,name,body){
 const s=getSession();s.exerciseNames??={};
 s.exerciseNames[exerciseOverrideKey(k,idx)]=name;
 s.exerciseBodies??={};s.exerciseBodies[exerciseOverrideKey(k,idx)]=body;
 save();render();
}
function setBlockData(type,day){
 activeSession=sessionKey(type,day,today());
 if(!store[activeSession])newSession(type,day);else{resetRuntime();workout.elapsed=store[activeSession].elapsed||0}
}
function setData(id){
 const s=getSession();s.sets??={};s.sets[id]??={};
 return s.sets[id];
}
function inputSet(k,id,index,kind,parentId=""){
 const r=setData(id),prev=v10Previous(k,id,kind);
 const label=kind==="ASC"?"A":"Set";
 return `<div class="set ${kind==="DROP"?"drop":kind==="EXTRA"?"extra":""}">
  <div class="settag">${kind==="ASC"?"ASCENDING":kind==="DROP"?"DROP SET":kind==="EXTRA"?"追加 SET":"MAIN SET"}</div>
  <div class="settop"><div class="setno">${label} ${index+1}</div>
   <div><label>重量 kg</label><input inputmode="decimal" value="${esc(r.weight||"")}" oninput="setField('${esc(id)}','weight',this.value)"></div>
   <div><label>Rep</label><input inputmode="numeric" value="${esc(r.rep||"")}" oninput="setField('${esc(id)}','rep',this.value)"></div>
   <div><label>RPE</label><input inputmode="decimal" value="${esc(r.rpe||"")}" oninput="setField('${esc(id)}','rpe',this.value)"></div>
  </div>
  ${prev?`<div class="v10-prev">前回：${esc(prev.weight||"—")}kg × ${esc(prev.rep||"—")}${prev.rpe?" @ RPE "+esc(prev.rpe):""}</div>`:""}
  <div class="formrow"><div><label>フォーム</label><select onchange="setField('${esc(id)}','form',this.value)"><option value="">—</option><option ${r.form==="◎"?"selected":""}>◎</option><option ${r.form==="○"?"selected":""}>○</option><option ${r.form==="△"?"selected":""}>△</option><option ${r.form==="×"?"selected":""}>×</option></select></div>
  <div><label>メモ</label><input value="${esc(r.memo||"")}" oninput="setField('${esc(id)}','memo',this.value)"></div></div>
  <div class="setactions">
   <button class="setdone ${r.done?"done":""}" onclick="v10FinishSet('${esc(id)}')">${r.done?"✓ 完了":"セット完了"}</button>
   ${kind==="MAIN"?`<button class="dropbtn" onclick="addDrop('${esc(id)}')">ドロップ</button>`:""}
   ${kind==="MAIN"?exerciseTimerButton(parentId):""}
  </div>
  ${kind==="DROP"?`<div class="drop-row"><span>このセットのドロップ</span><button class="drop-delete" onclick="deleteDrop('${esc(id)}')">削除</button></div>`:""}
 </div>`;
}
function exerciseCard(k,e,idx,variable=false){
 const s=getSession(),ex=exerciseFor(k,e,idx),name=ex.name;
 const mainCount=Math.max(1,Math.min(30,Number(s.mainCounts?.[name]??ex.sets)||ex.sets||1));
 const ascCount=Math.max(0,Math.min(20,Number(s.ascCounts?.[name]??3)));
 let asc="",main="";
 for(let i=0;i<ascCount;i++)asc+=inputSet(k,k+"|"+name+"|ASC|"+i,i,"ASC",k+"|"+name);
 for(let i=0;i<mainCount;i++){
   const id=k+"|"+name+"|MAIN|"+i;
   main+=inputSet(k,id,i,"MAIN",k+"|"+name);
   const drops=s.dropCounts?.[id]||0;
   for(let d=0;d<drops;d++)main+=inputSet(k,id+"|DROP|"+d,d,"DROP",k+"|"+name);
 }
 const options=(EXLIB[ex.body]||[]).map(x=>`<option ${x===name?"selected":""}>${esc(x)}</option>`).join("");
 const selector=`<div class="replace"><label>部位</label><select onchange="changeExerciseBody('${esc(k)}',${idx},this.value)">${Object.keys(EXLIB).map(b=>`<option ${b===ex.body?"selected":""}>${b}</option>`).join("")}</select><label>種目</label><select onchange="replaceExercise('${esc(k)}',${idx},this.value,'${esc(ex.body)}')">${options}</select></div>`;
 const st=v10Stats(k,name);
 const ascControls=`<div class="set-control"><button onclick="changeSetCount('${esc(k)}','${esc(name)}','ASC',-1,${ascCount})">− セット削除</button><button onclick="changeSetCount('${esc(k)}','${esc(name)}','ASC',1,${ascCount})">＋ セット追加</button></div>`;
 const mainControls=`<div class="set-control"><button onclick="changeSetCount('${esc(k)}','${esc(name)}','MAIN',-1,${mainCount})">− セット削除</button><button onclick="changeSetCount('${esc(k)}','${esc(name)}','MAIN',1,${mainCount})">＋ セット追加</button></div>`;
 return `<div class="exercise">
  <div class="exhead"><div class="exname">${esc(name)}</div>${selector}
   <div class="rx"><strong>処方：</strong>${mainCount}セット × ${esc(ex.rep||"")}${ex.rx?"｜"+esc(ex.rx):""}${ex.note?"<br>"+esc(ex.note):""}</div>
   <div class="v10-actions"><button onclick="v10CopyPrevious('${esc(k)}','${esc(name)}',${mainCount})">↻ 前回コピー</button></div>
   <div class="small">完了 ${st.done}/${st.total}｜Volume ${Math.round(st.volume).toLocaleString()}kg</div>
  </div>
  <details class="asc" ${ascCount>0?"":"open"}><summary>▶ Ascending Set（${ascCount}）</summary>${asc}${ascControls}</details>
  <div class="sectiontitle">MAIN SET</div>${main}${mainControls}
  <div class="exercise-note"><label>種目メモ</label><input value="${esc(s.exerciseNotes?.[name]||"")}" onchange="v10Note('${esc(k)}','${esc(name)}',this.value)" placeholder="次回へのメモ・重量判断など"></div>
 </div>`;
}
function changeSetCount(k,name,type,delta,current){
 const s=getSession();
 if(type==="MAIN"){s.mainCounts??={};s.mainCounts[name]=Math.max(1,Math.min(30,(s.mainCounts[name]??current)+delta))}
 else{s.ascCounts??={};s.ascCounts[name]=Math.max(0,Math.min(20,(s.ascCounts[name]??current)+delta))}
 save();render();
}
function addDrop(parentId){
 const s=getSession();s.dropCounts??={};s.dropCounts[parentId]=(s.dropCounts[parentId]||0)+1;save();render();
}
function deleteDrop(dropId){
 const parts=dropId.split("|"),d=parts.pop(),type=parts.pop();
 const parent=parts.join("|"),s=getSession();
 if(!s.dropCounts?.[parent])return;
 s.dropCounts[parent]=Math.max(0,(s.dropCounts[parent]||0)-1);
 if(!s.dropCounts[parent])delete s.dropCounts[parent];
 delete s.sets[dropId];
 save();render();
}
function v10Stats(k,name){
 const d=get(k),a=Object.entries(d.sets||{}).filter(([id])=>id.startsWith(k+"|"+name+"|"));
 return {total:a.length,done:a.filter(([,r])=>r.done).length,volume:a.reduce((n,[,r])=>n+(+r.weight||0)*(+r.rep||0),0)}
}
function v10Previous(k,id,kind){
 const base=id.split("|").slice(-3).join("|");
 const logs=Object.entries(store).filter(([key,v])=>key!==k&&v?.savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);
 for(const [,v] of logs)for(const [sid,r] of Object.entries(v.sets||{})){
  if(sid.split("|").slice(-3).join("|")===base && sid.includes("|"+kind+"|"))return r;
 }
 return null;
}
function v10Add(k,name,type){
 const s=getSession();
 if(type==="DROP"){s.dropCounts??={};const id=k+"|"+name+"|MAIN|"+Math.max(0,(s.mainCounts?.[name]??1)-1);s.dropCounts[id]=(s.dropCounts[id]||0)+1}
 else{s.extraCounts??={};s.extraCounts[name]=(s.extraCounts[name]||0)+1}
 save();render();
}
function v10Note(k,name,v){const d=get(k);d.exerciseNotes??={};d.exerciseNotes[name]=v;save()}
function v10CopyPrevious(k,name,n){
 const d=get(k),logs=Object.entries(store).filter(([key,v])=>key!==k&&v?.savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);
 for(const [,v] of logs){
  const prev=Object.entries(v.sets||{}).filter(([id])=>id.includes("|"+name+"|MAIN|"));
  if(!prev.length)continue;
  for(let i=0;i<n;i++){
   const p=prev.find(([id])=>id.endsWith("|MAIN|"+i));
   if(p)d.sets[k+"|"+name+"|MAIN|"+i]={...p[1],done:false};
  }
  break;
 }
 save();render()
}
function v10FinishSet(id){
 const d=getSession();d.sets??={};d.sets[id]??={};d.sets[id].done=!d.sets[id].done;save();
 if(d.sets[id].done){
   const parts=id.split("|");
   const mainIndex=parts.indexOf("MAIN");
   const ex=mainIndex>=0?parts.slice(0,mainIndex).join("|"):parts.slice(0,-2).join("|");
   selectTimer(ex);startTimer(ex,"rest");
 }
 render()
}
function v10Summary(){
 const d=getSession(),a=Object.values(d.sets||{}),vol=a.reduce((n,r)=>n+(+r.weight||0)*(+r.rep||0),0);
 return `<div class="card"><h2>セッションサマリー</h2><div class="summary"><div class="stat"><b>${a.filter(r=>r.done).length}</b><span>完了セット</span></div><div class="stat"><b>${a.length}</b><span>総セット</span></div><div class="stat"><b>${Math.round(vol).toLocaleString()}kg</b><span>総ボリューム</span></div><div class="stat"><b>${v10Duration(d)}</b><span>トレーニング時間</span></div></div></div>`
}
function v10Duration(d){
 if(!d.startedAt)return"00:00";
 let s=Math.max(0,Math.floor(((d.finishedAt||Date.now())-d.startedAt)/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
 return `${h?String(h).padStart(2,"0")+":":""}${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`
}
function workTimer(){
 const s=getSession();return `<div class="worktimer"><div><div class="small">トレーニング時間</div><div id="workClock" class="workclock">${fmt(workout.elapsed||s.elapsed||0)}</div></div><div><button onclick="startWorkout()">開始</button><button onclick="pauseWorkout()">停止</button><button onclick="resetWorkout()">リセット</button></div></div>`
}
function end(){
 const s=getSession();return v10Summary()+`<label>当日メモ・特記事項</label><textarea oninput="setMeta('note',this.value)">${esc(s.note||"")}</textarea><div class="action"><button class="primary" onclick="commit()">保存</button><button class="secondary" onclick="resetSession()">リセット</button></div>`
}
function commit(){getSession().finishedAt=Date.now();save();const s=getSession();s.savedAt=Date.now();s.elapsed=workout.elapsed;save();alert("保存しました")}
function resetSession(){if(confirm("このトレーニングログをリセットしますか？")){delete store[activeSession];save();newSession(getSession().type,getSession().day);render()}}
function navDraw(){nav.innerHTML=tabs.map(t=>`<button class="${t===current?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}
function go(t){pauseWorkout();resetRuntime();current=t;activeSession=null;navDraw();render();scrollTo(0,0)}
function selectBBB(n){bbbDay=n;localStorage.setItem("bbbDay",n);activeSession=null;render()}
function selectWeek(w){selectedWeek=w;localStorage.setItem("selectedWeek",w);selectedDay=Object.keys(P[w]||{})[0]||"D1";localStorage.setItem("selectedDay",selectedDay);activeSession=null;render()}
function selectDay(d){selectedDay=d;localStorage.setItem("selectedDay",d);activeSession=null;render()}
function openHistory(k){activeSession=k;const s=store[k];current=s.type==="BBB"?"BBB":s.type==="PRE"?"PRE":"PPP";if(current==="BBB")bbbDay=s.day;if(current==="PPP"){selectedWeek=s.type;selectedDay=s.day}resetRuntime();workout.elapsed=s.elapsed||0;navDraw();render();scrollTo(0,0)}
function history(){
 const a=Object.entries(store).filter(([k,v])=>v.savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);
 return `<div class="card"><h2>履歴</h2><div class="small">同じ種目・同じ曜日でも、日付ごとに別ログとして保存。</div></div>`+
 (a.length?a.map(([k,v])=>`<div class="card history-item" onclick="openHistory('${esc(k)}')"><div class="history-date">${esc(v.date||"—")}｜${esc(v.type)}｜${esc(v.day)}</div><div class="history-sub">保存：${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg｜トレーニング ${fmt(v.elapsed||0)}</div></div>`).join(""):"<div class='card'>保存履歴なし</div>")
}
function render(){
 if(current==="HOME"){
  app.innerHTML=`<div class="card"><h2>Workout Log</h2><div class="notice">1回のトレーニングを1ログとして保存。Ascending / Mainを分離し、タイマーは各種目カード内に配置。</div><h3>構成</h3><span class="badge">PRE</span><span class="badge">BBB</span><span class="badge">PPP W1〜W8</span><h3>タイマー</h3><div class="small">🕰️は各セットの横。種目ごとにセット間・種目間の秒数を記憶。</div></div>`;
 }
 else if(current==="PRE"){
  setBlockData("PRE","D1");let k="PRE";
  app.innerHTML=`<div class="card"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなく、BBB初期重量・フォーム・動作を校正。</div>${meta()}${workTimer()}${PRE.map((x,i)=>exerciseCard(k,{name:x[0],sets:1,rep:x[1],rx:x[2]},i)).join("")}${end()}</div>`;
 }
 else if(current==="BBB"){
  const days=[["月","Legs"],["水","Chest"],["木","Shoulders"],["土","Back"],["日","Arms"]];
  setBlockData("BBB",bbbDay);let k="BBB";
  app.innerHTML=`<div class="card"><h2>BBB</h2><div class="daytabs">${days.map(([d,n])=>`<button class="${n===bbbDay?"active":""}" onclick="selectBBB('${n}')">${d} ${n}</button>`).join("")}</div><div class="small">各種目のMainセット数を − / ＋ で変更可能。</div></div><div class="card"><h2>${days.find(x=>x[1]===bbbDay)[0]}：${bbbDay}</h2>${meta()}${workTimer()}${BBB[bbbDay].map((x,i)=>exerciseCard(k,{name:x[0],sets:x[1],rep:x[2],body:(bbbDay==="Arms"?(i<3?"三頭":"二頭"):(BODYFOR[bbbDay]||"胸"))},i,true)).join("")}${end()}</div>`;
 }
 else if(current==="PPP"){
  const weeks=Object.keys(P);if(!weeks.includes(selectedWeek))selectedWeek=weeks[0];const days=Object.keys(P[selectedWeek]||{});if(!days.includes(selectedDay))selectedDay=days[0];
  setBlockData(selectedWeek,selectedDay);let k="PPP";
  app.innerHTML=`<div class="card"><h2>PPP</h2><div class="weektabs">${weeks.map(w=>`<button class="${w===selectedWeek?"active":""}" onclick="selectWeek('${w}')">${w.replace("PPP ","W")}</button>`).join("")}</div><div class="daytabs">${days.map(d=>`<button class="${d===selectedDay?"active":""}" onclick="selectDay('${d}')">${d}</button>`).join("")}</div><div class="small">週とDayをタブで切替。</div></div><div class="card"><h2>${selectedWeek}：${selectedDay}</h2>${meta()}${workTimer()}${P[selectedWeek][selectedDay].map((e,i)=>exerciseCard(k,e,i)).join("")}${end()}</div>`;
 }
 else app.innerHTML=history();
}
navDraw();render();
</script>
</body>
</html>
