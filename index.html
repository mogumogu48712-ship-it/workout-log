<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Workout Log V21</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:50;background:#111;color:#fff;padding:12px}
h1{font-size:20px;margin:0}.sub{font-size:11px;opacity:.7;margin-top:3px}
main{max-width:600px;margin:auto;padding:7px 9px 90px}
nav{position:sticky;top:61px;z-index:40;display:flex;gap:6px;overflow-x:auto;background:#f2f2f2;padding:5px 0 9px}
nav button,.daytabs button{flex:0 0 auto;border:1px solid #ccc;background:#fff;border-radius:9px;padding:9px 12px;font-weight:800}
nav button.active,.daytabs button.active{background:#111;color:#fff;border-color:#111}
.card,.exercise{background:#fff;border:1px solid #d1d1d1;border-radius:13px;margin:9px 0}.card{padding:12px}.exercise{overflow:hidden}
h2{font-size:19px;margin:0 0 9px}h3{font-size:15px;margin:15px 0 7px}
.small{font-size:11px;color:#666}.notice{font-size:13px;line-height:1.55;background:#f7f7f7;border-radius:9px;padding:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
label{display:block;font-size:11px;color:#666;margin-bottom:4px}
input,textarea,select{width:100%;border:1px solid #c8c8c8;border-radius:8px;background:#fff;padding:8px}
textarea{min-height:70px}
.choice{display:flex;gap:4px}.choice button{flex:1;border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 2px}.choice button.on{background:#111;color:#fff}
.exhead{padding:11px;border-bottom:1px solid #ddd}.exline{display:flex;align-items:center;justify-content:space-between;gap:7px}
.exname{font-size:17px;font-weight:850}.rx{font-size:11px;line-height:1.45;color:#555;margin-top:4px}.rx strong{color:#111}
.exswap{border:1px solid #ccc;background:#fff;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:800}
.sectiontitle{font-size:12px;font-weight:850;padding:9px 10px 4px}
.set{padding:9px 10px;border-bottom:1px solid #e7e7e7}.set:last-child{border-bottom:0}
.settop{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:6px;align-items:end}.setno{font-size:13px;font-weight:850;padding-bottom:8px}
.set input{text-align:center;padding:8px 5px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.set-actions{display:flex;gap:5px;margin-top:7px}.set-actions button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 8px;font-size:11px;font-weight:850}
.set-actions .complete{flex:1}.set-actions .drop{flex:1}.set-actions .clock{flex:0 0 44px;font-size:15px;padding:5px}.set-actions .done{background:#111;color:#fff}
.dropbox{display:none;margin-top:6px;padding:7px;background:#f7f7f7;border-radius:8px}.dropbox.open{display:block}
.dropitem{display:grid;grid-template-columns:1fr 1fr 32px;gap:5px;margin:5px 0}.dropitem button{border:1px solid #ccc;background:#fff;border-radius:7px;font-weight:900}
.dropadd,.dropdel{border:1px solid #ccc;background:#fff;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:800}
.asc-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px}.asc-controls{display:flex;gap:4px}.asc-controls button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800}
.asc-set{background:#fcfcfc}.asc-set .set-actions .add{flex:1}.asc-set .set-actions .del{flex:1}
.daytabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 9px}
.program-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.program-grid button{border:1px solid #ccc;background:#fff;border-radius:9px;padding:10px;text-align:left;font-weight:800}
.action{display:flex;gap:7px;margin-top:10px}.action button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:850}.primary{background:#111;color:#fff}.secondary{background:#e8e8e8}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:10px;margin:2px}
#fixedTimer{position:fixed;right:10px;bottom:10px;z-index:200;background:#111;color:#fff;border-radius:12px;padding:8px 9px;box-shadow:0 4px 18px #0004;width:min(330px,calc(100vw - 20px));display:none}
#fixedTimer.show{display:block}.ftop{display:flex;align-items:center;justify-content:space-between}.ftitle{font-size:11px;font-weight:850}.timer-name{font-size:11px;font-weight:800;margin:3px 0}
.fdisplay{text-align:center;font-size:30px;font-weight:950;font-variant-numeric:tabular-nums;line-height:1.1}.fsettings{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0}.fsettings input{padding:5px;text-align:center}
.factions{display:flex;gap:4px}.factions button{flex:1;border:0;border-radius:6px;padding:6px 4px;font-size:10px;font-weight:850}
#workClock{position:fixed;left:10px;bottom:10px;z-index:190;background:#fff;border:1px solid #ccc;border-radius:10px;padding:6px 9px;box-shadow:0 3px 12px #0002;font-size:11px;font-weight:850}
@media(max-width:380px){.settop{grid-template-columns:36px 1fr 1fr 1fr}.set input{font-size:14px}.program-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Workout Log V21</h1><div class="sub">Power Building｜PRE → BBB → PPP W1〜W8 → TEST</div></header>
<main><nav id="nav"></nav><div id="app"></div></main>
<div id="workClock">トレーニング 00:00:00</div>
<div id="fixedTimer">
 <div class="ftop"><span class="ftitle" id="ftitle">セット間休憩</span><button onclick="closeTimer()">×</button></div>
 <div class="timer-name" id="timerName">—</div>
 <div class="fdisplay" id="timerDisplay">02:00</div>
 <div class="fsettings">
  <div><label>セット間 秒</label><input id="restInput" type="number" min="0" max="900" step="5"></div>
  <div><label>種目間 秒</label><input id="exerciseInput" type="number" min="0" max="900" step="5"></div>
 </div>
 <div class="factions"><button onclick="startTimer('rest')">セット間▶</button><button onclick="startTimer('exercise')">種目間▶</button><button onclick="stopTimer()">■</button><button onclick="resetTimer()">↺</button></div>
</div>

<script>
const tabs=["HOME","PRE","BBB","PPP","HISTORY"];
const BBB={
"脚":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"胸":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"背中":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"肩":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"三頭":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""]],
"二頭":[["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]],
"前腕":[["リストカール",5,"10〜15"],["リバースリストカール",5,"10〜15"],["ハンマーカール",5,"8〜12"]],
"腹筋":[["アブドミナルマシン",5,"10〜15"],["ケーブルクランチ",5,"10〜15"],["ハンギングレッグレイズ",4,"8〜15"]]
};
const PPP={};
const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
for(let w=1;w<=4;w++)PPP[w]={D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7")]};
PPP[5]={D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]};
PPP[6]={D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]};
PPP[7]={D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],D2:[E("Competition DL",3,"1","70〜75%")],D3:[E("Competition BP",2,"3","75%")]};
PPP[8]={"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]};

let current="HOME",bbbDay=localStorage.getItem("bbbDay")||"脚",pppWeek=Number(localStorage.getItem("pppWeek")||1);
let store=JSON.parse(localStorage.getItem("pbWorkoutV21")||"{}");
let timerState=null,timerIv=null,workStarted=Number(localStorage.getItem("workStarted")||0),workElapsed=Number(localStorage.getItem("workElapsed")||0);
const nav=document.getElementById("nav"),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const get=k=>(store[k]??={sets:{},exercises:{}});
const save=()=>localStorage.setItem("pbWorkoutV21",JSON.stringify(store));
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const fmtWork=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function navDraw(){nav.innerHTML=tabs.map(t=>`<button class="${t==current?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}
function go(t){current=t;navDraw();render();scrollTo(0,0)}
function meta(k){let d=get(k);return `<div class="meta"><div><label>日付</label><input type="date" data-meta="${esc(k)}" data-f="date" value="${esc(d.date||"")}"></div><div><label>体重 kg（任意）</label><input inputmode="decimal" data-meta="${esc(k)}" data-f="weight" value="${esc(d.weight||"")}"></div></div><div class="meta"><div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.sleep==n?"on":""}" onclick="choice('${esc(k)}','sleep',${n})">${n}</button>`).join("")}</div></div><div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.fatigue==n?"on":""}" onclick="choice('${esc(k)}','fatigue',${n})">${n}</button>`).join("")}</div></div></div>`}

function exerciseTimerSetup(k,id,name){
 const d=get(k);d.exercises[id]??={};d.exercises[id].name=name;d.exercises[id].timer??={rest:120,exercise:300};save();
}
function dropRows(k,id,i){
 const d=get(k),key=id+"#"+i,arr=d.sets[key+"#drops"]||[],open=!!d.sets[key]?.dropOpen;
 return `<div class="dropbox ${open?"open":""}"><div class="small"><b>Set ${i+1} Drop Sets</b></div>
 ${arr.map((r,j)=>`<div class="dropitem"><input inputmode="decimal" placeholder="重量 kg" data-row="${esc(k)}" data-id="${esc(key+"#drops#"+j)}" data-f="weight" value="${esc(r.weight||"")}"><input inputmode="numeric" placeholder="Rep" data-row="${esc(k)}" data-id="${esc(key+"#drops#"+j)}" data-f="rep" value="${esc(r.rep||"")}"><button onclick="removeDrop('${esc(k)}','${esc(id)}',${i},${j})">×</button></div>`).join("")}
 <button class="dropadd" onclick="addDrop('${esc(k)}','${esc(id)}',${i})">＋ Drop Set追加</button>
 ${arr.length?`<button class="dropdel" onclick="removeDrop('${esc(k)}','${esc(id)}',${arr.length-1})">最後のDrop削除</button>`:""}
 </div>`;
}
function mainRow(k,id,i){
 const d=get(k),key=id+"#"+i,r=d.sets[key]||{},done=!!r.completed;
 return `<div class="set"><div class="settop"><div class="setno">Set ${i+1}</div>
 <div><label>重量 kg</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="weight" value="${esc(r.weight||"")}"></div>
 <div><label>Rep</label><input inputmode="numeric" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rep" value="${esc(r.rep||"")}"></div>
 <div><label>RPE</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rpe" value="${esc(r.rpe||"")}"></div></div>
 <div class="formrow"><div><label>フォーム</label><select data-row="${esc(k)}" data-id="${esc(key)}" data-f="form"><option value="">—</option><option ${r.form=="◎"?"selected":""}>◎</option><option ${r.form=="○"?"selected":""}>○</option><option ${r.form=="△"?"selected":""}>△</option><option ${r.form=="×"?"selected":""}>×</option></select></div>
 <div><label>メモ</label><input data-row="${esc(k)}" data-id="${esc(key)}" data-f="memo" value="${esc(r.memo||"")}"></div></div>
 <div class="set-actions"><button class="complete ${done?"done":""}" onclick="completeSet('${esc(k)}','${esc(id)}',${i},this)">${done?"✓ 完了":"セット完了"}</button><button class="drop" onclick="toggleDrop('${esc(k)}','${esc(id)}',${i})">ドロップ</button><button class="clock" onclick="openTimer('${esc(k)}','${esc(id)}')">🕰️</button></div>
 ${dropRows(k,id,i)}</div>`;
}
function ascRows(k,id,count){
 const d=get(k),n=Math.max(1,Math.min(15,Number(count)||1));let out="";
 for(let i=0;i<n;i++){const key=id+"#asc#"+i,r=d.sets[key]||{},done=!!r.completed;
 out+=`<div class="set asc-set"><div class="settop"><div class="setno">Set ${i+1}</div>
 <div><label>重量 kg</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="weight" value="${esc(r.weight||"")}"></div>
 <div><label>Rep</label><input inputmode="numeric" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rep" value="${esc(r.rep||"")}"></div>
 <div><label>RPE</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rpe" value="${esc(r.rpe||"")}"></div></div>
 <div class="formrow"><div><label>フォーム</label><select data-row="${esc(k)}" data-id="${esc(key)}" data-f="form"><option value="">—</option><option ${r.form=="◎"?"selected":""}>◎</option><option ${r.form=="○"?"selected":""}>○</option><option ${r.form=="△"?"selected":""}>△</option><option ${r.form=="×"?"selected":""}>×</option></select></div>
 <div><label>メモ</label><input data-row="${esc(k)}" data-id="${esc(key)}" data-f="memo" value="${esc(r.memo||"")}"></div></div>
 <div class="set-actions"><button class="complete ${done?"done":""}" onclick="completeAsc('${esc(k)}','${esc(id)}',${i},this)">${done?"✓ 完了":"セット完了"}</button><button class="add" onclick="changeAsc('${esc(k)}','${esc(id)}',1)">セット追加</button><button class="clock" onclick="openTimer('${esc(k)}','${esc(id)}')">🕰️</button></div></div>`}
 return out;
}
function exerciseCard(k,e,index){
 const d=get(k),id="EX|"+index+"|"+e.name.replace(/[|#]/g,"_");d.exercises[id]??={name:e.name,timer:{rest:120,exercise:300},ascCount:3};exerciseTimerSetup(k,id,e.name);
 const count=Math.max(1,Math.min(20,Number(d.exercises[id].mainCount??e.sets)));
 const ascCount=Math.max(1,Math.min(15,Number(d.exercises[id].ascCount??3)));
 return `<div class="exercise"><div class="exhead"><div class="exline"><div class="exname">${esc(e.name)}</div><button class="exswap" onclick="swapExercise('${esc(k)}','${esc(id)}','${esc(e.name)}')">種目変更</button></div>
 <div class="rx"><strong>処方：</strong>${e.sets}セット × ${esc(e.rep)}${e.rx?"｜"+esc(e.rx):""}${e.note?"<br>"+esc(e.note):""}</div></div>
 <div class="sectiontitle">Ascending Set</div>${ascRows(k,id,ascCount)}
 <div class="sectiontitle">Main Set（${count}セット）</div>${Array.from({length:count},(_,i)=>mainRow(k,id,i)).join("")}
 <div class="asc-head"><span class="small">Main Set</span><div class="asc-controls"><button onclick="changeMain('${esc(k)}','${esc(id)}',-1)">セット削除</button><button onclick="changeMain('${esc(k)}','${esc(id)}',1)">セット追加</button></div></div>
 </div>`;
}

function swapExercise(k,id,old){
 const choices=["バーベルスクワット","ハックスクワット","レッグプレス","ベンチプレス","Larsen BP","ダンベルベンチプレス","デッドリフト","トップサイドデッドリフト","バーベルベントオーバーロウ","OHP","スミスバックプレス","ダンベルサイドレイズ","JMプレス","スミスOHエクステンション","バーベルカール","ケーブルカール","リストカール","アブドミナルマシン"];
 const v=prompt("差し替える種目名を入力",old);if(!v)return;let d=get(k);d.exercises[id].name=v;d.exercises[id].timer??={rest:120,exercise:300};save();render();
}
function completeSet(k,id,i,btn){const d=get(k),key=id+"#"+i;d.sets[key]??={};d.sets[key].completed=!d.sets[key].completed;save();btn.classList.toggle("done",d.sets[key].completed);btn.textContent=d.sets[key].completed?"✓ 完了":"セット完了"}
function completeAsc(k,id,i,btn){const d=get(k),key=id+"#asc#"+i;d.sets[key]??={};d.sets[key].completed=!d.sets[key].completed;save();btn.classList.toggle("done",d.sets[key].completed);btn.textContent=d.sets[key].completed?"✓ 完了":"セット完了"}
function toggleDrop(k,id,i){const d=get(k),key=id+"#"+i;d.sets[key]??={};d.sets[key].dropOpen=!d.sets[key].dropOpen;save();render()}
function addDrop(k,id,i){const d=get(k),key=id+"#"+i+"#drops";d.sets[key]??=[];d.sets[key].push({});d.sets[id+"#"+i]??={};d.sets[id+"#"+i].dropOpen=true;save();render()}
function removeDrop(k,id,i,j){const d=get(k),key=id+"#"+i+"#drops";if(!d.sets[key])return;d.sets[key].splice(j,1);save();render()}
function changeMain(k,id,delta){const d=get(k);d.exercises[id]??={};d.exercises[id].mainCount=Math.max(1,Math.min(20,Number(d.exercises[id].mainCount||1)+delta));save();render()}
function changeAsc(k,id,delta){const d=get(k);d.exercises[id]??={};d.exercises[id].ascCount=Math.max(1,Math.min(15,Number(d.exercises[id].ascCount||1)+delta));save();render()}

function openTimer(k,id){
 const d=get(k),ex=d.exercises[id]||{};ex.timer??={rest:120,exercise:300};d.exercises[id]=ex;save();
 timerState={k,id,type:"rest"};document.getElementById("fixedTimer").classList.add("show");document.getElementById("timerName").textContent=ex.name||id;document.getElementById("restInput").value=ex.timer.rest;document.getElementById("exerciseInput").value=ex.timer.exercise;document.getElementById("timerDisplay").textContent=fmt(ex.timer.rest);
 document.getElementById("restInput").onchange=()=>saveTimerSetting("rest");document.getElementById("exerciseInput").onchange=()=>saveTimerSetting("exercise");
}
function saveTimerSetting(type){if(!timerState)return;const d=get(timerState.k),ex=d.exercises[timerState.id];ex.timer??={rest:120,exercise:300};const el=document.getElementById(type=="rest"?"restInput":"exerciseInput");ex.timer[type]=Math.max(0,Math.min(900,Number(el.value)||0));save();if(!timerIv)document.getElementById("timerDisplay").textContent=fmt(ex.timer[type])}
function startTimer(type){if(!timerState)return;saveTimerSetting(type);clearInterval(timerIv);timerState.type=type;const ex=get(timerState.k).exercises[timerState.id],seconds=Number(ex.timer[type]||0);let end=Date.now()+seconds*1000;document.getElementById("ftitle").textContent=type=="rest"?"セット間休憩":"種目間休憩";const tick=()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("timerDisplay").textContent=fmt(left);if(left<=0){clearInterval(timerIv);timerIv=null;beep()}};tick();timerIv=setInterval(tick,250)}
function stopTimer(){clearInterval(timerIv);timerIv=null}
function resetTimer(){stopTimer();if(!timerState)return;const ex=get(timerState.k).exercises[timerState.id];document.getElementById("timerDisplay").textContent=fmt(ex.timer[timerState.type||"rest"]||0)}
function closeTimer(){stopTimer();timerState=null;document.getElementById("fixedTimer").classList.remove("show")}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}

function startWork(){if(!workStarted){workStarted=Date.now();localStorage.setItem("workStarted",workStarted)}}
function stopWork(){if(workStarted){workElapsed+=Date.now()-workStarted;workStarted=0;localStorage.setItem("workStarted",0);localStorage.setItem("workElapsed",workElapsed)}}
function updateWorkClock(){let ms=workElapsed+(workStarted?Date.now()-workStarted:0);document.getElementById("workClock").textContent="トレーニング "+fmtWork(ms/1000)}
setInterval(updateWorkClock,500);document.addEventListener("click",e=>{if(e.target.closest("input,select,textarea,nav"))return; if(e.target.closest(".set-actions,.asc-actions,.exercise"))startWork()});

function choice(k,f,n){get(k)[f]=n;save();render()}
function week(v){pppWeek=Number(v);localStorage.setItem("pppWeek",pppWeek);render()}
function bind(){document.querySelectorAll("[data-meta]").forEach(x=>x.oninput=()=>{get(x.dataset.meta)[x.dataset.f]=x.value;save()});document.querySelectorAll("[data-row]").forEach(x=>x.oninput=()=>{get(x.dataset.row).sets[x.dataset.id]??={};get(x.dataset.row).sets[x.dataset.id][x.dataset.f]=x.value;save()})}

function end(k){let d=get(k);return `<label>当日メモ・特記事項</label><textarea data-meta-note="${esc(k)}">${esc(d.note||"")}</textarea><div class="action"><button class="primary" onclick="saveDay('${esc(k)}')">保存</button><button class="secondary" onclick="resetDay('${esc(k)}')">リセット</button></div>`}
function saveDay(k){get(k).savedAt=Date.now();save();alert("保存しました")}
function resetDay(k){if(confirm("この日の入力をリセットしますか？")){delete store[k];save();render()}}

function render(){
 if(current=="HOME"){app.innerHTML=`<div class="card"><h2>Workout Log</h2><div class="notice">処方と実績を分離。Ascending / Main / Drop / タイマーを種目・セット単位で管理。タイマーはスクロールしても固定。</div><h3>プログラムから一発呼び出し</h3><div class="program-grid"><button onclick="go('PRE')">PRE Week 1</button><button onclick="go('BBB')">BBB</button>${[1,2,3,4,5,6,7,8].map(w=>`<button onclick="pppWeek=${w};localStorage.setItem('pppWeek',${w});go('PPP')">PPP W${w}</button>`).join("")}</div><h3>トレーニング時間</h3><div class="action"><button class="primary" onclick="startWork()">開始</button><button class="secondary" onclick="stopWork()">停止</button><button class="secondary" onclick="workElapsed=0;workStarted=0;localStorage.setItem('workElapsed',0);localStorage.setItem('workStarted',0)">リセット</button></div></div>`}
 else if(current=="PRE"){let k="PRE|D1";const arr=[E("High-bar SQ",1,"Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"),E("Competition BP",1,"Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"),E("Competition DL",1,"Ascending → Top 180kg × 1","必要なら185〜190kg確認")];app.innerHTML=`<div class="card"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなくBBB初期重量・フォーム・動作を校正。</div>${meta(k)}${arr.map((e,i)=>exerciseCard(k,e,i)).join("")}${end(k)}</div>`}
 else if(current=="BBB"){const days=Object.keys(BBB),k="BBB|"+bbbDay;app.innerHTML=`<div class="card"><h2>BBB</h2><div class="daytabs">${days.map(n=>`<button class="${n==bbbDay?"active":""}" onclick="bbbDay='${n}';localStorage.setItem('bbbDay','${n}');render()">${n}</button>`).join("")}</div><div class="small">部位タブで切替</div></div><div class="card"><h2>${bbbDay}</h2>${meta(k)}${BBB[bbbDay].map((x,i)=>exerciseCard(k,E(x[0],x[1],x[2]),i)).join("")}${end(k)}</div>`}
 else if(current=="PPP"){const days=Object.keys(PPP[pppWeek]||{}),weekTabs=[1,2,3,4,5,6,7,8];app.innerHTML=`<div class="card"><h2>PPP</h2><div class="daytabs">${weekTabs.map(w=>`<button class="${w==pppWeek?"active":""}" onclick="week(${w})">W${w}</button>`).join("")}</div><div class="small">Weekをタップして切替</div></div>${days.map(day=>{let k="PPP W"+pppWeek+"|"+day;return `<div class="card"><h2>${day}</h2>${meta(k)}${PPP[pppWeek][day].map((e,i)=>exerciseCard(k,e,i)).join("")}${end(k)}</div>`}).join("")}`}
 else {let a=Object.entries(store).filter(x=>x[1].savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);app.innerHTML=`<div class="card"><h2>履歴</h2><div class="small">この端末のブラウザに保存。</div></div>${a.length?a.map(([k,v])=>`<div class="card"><b>${esc(k)}</b><div class="small">${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg</div></div>`).join(""):"<div class='card'>保存履歴なし</div>"}`}
 bind();
}
navDraw();render();updateWorkClock();
</script>
</body></html>
