<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Workout Log V23</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5f8;--card:#fff;--line:#e1e5ea;--muted:#8a929d;--ink:#17191d;--soft:#f6f7f9;--accent:#8eb800}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body{padding-bottom:110px}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #edf0f3}
.top{height:72px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 10px}
.top h1{text-align:center;font-size:22px;margin:0;font-weight:900}
.top button{width:44px;height:44px;border:0;background:#fff;border-radius:50%;font-size:30px;color:#647084}
.menu{font-size:28px!important}
nav{display:flex;gap:8px;overflow:auto;padding:9px 12px;background:#fff;border-top:1px solid #f0f1f3}
nav button,.daytabs button{white-space:nowrap;border:1px solid #d6dbe1;background:#fff;border-radius:999px;padding:8px 14px;font-weight:850;font-size:13px}
nav button.active,.daytabs button.active{background:#17191d;color:#fff;border-color:#17191d}
main{max-width:760px;margin:auto;padding:10px 0 20px}
.card{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:9px 0}
.cardpad{padding:14px}
.program-head{padding:14px}
.daytabs{display:flex;gap:7px;overflow:auto;padding:0 14px 12px}
.sectionbar{padding:11px 14px;font-weight:900;font-size:13px;border-top:1px solid #edf0f3;background:#fafbfc}
.notice{background:#f7f8fa;border-radius:12px;padding:12px;font-size:13px;line-height:1.55;color:#5f6772}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #d8dde4;border-radius:9px;background:#fff;padding:9px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.choice{display:flex;gap:4px}.choice button{flex:1;border:1px solid #d8dde4;background:#fff;border-radius:8px;padding:8px 2px;font-weight:800}.choice button.on{background:#17191d;color:#fff}
.exercise{background:#fff;border-top:1px solid var(--line)}
.exhead{padding:14px 14px 10px}
.exline{display:flex;align-items:center;gap:10px}
.info{width:32px;height:32px;border:2px solid #738096;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#738096;flex:0 0 32px}
.badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#e8f8f7;color:#16aaa8;flex:0 0 32px}
.exname{font-size:20px;font-weight:900;flex:1;min-width:0}
.exmenu,.exdelete{border:0;background:#fff;color:#728095;font-size:24px;padding:4px 3px}
.exdelete{font-size:25px}
.rx{margin:6px 0 0 74px;color:#717986;font-size:11px;line-height:1.5}
.worktime{font-size:15px;padding:8px 14px;color:#20242a}
.exercise-note{display:grid;grid-template-columns:1fr auto;gap:8px;padding:0 14px 12px}
.exercise-note .recent{border:1px solid #cfd5dc;background:#fff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;white-space:nowrap}
.sethead,.setrow{display:grid;grid-template-columns:54px 1fr 1fr 64px;gap:8px;align-items:center;padding:0 14px}
.sethead{padding-bottom:7px;color:#a4aab2;font-size:12px;font-weight:900}
.setrow{padding-bottom:8px}
.setno{background:#f1f3f5;border-radius:7px;padding:10px 4px;text-align:center;font-weight:900}
.setrow input{text-align:center;padding:10px 5px}
.donebtn{height:44px;border:0;border-radius:8px;background:#e7e9eb;color:#fff;font-size:27px;font-weight:900}
.donebtn.done{background:#17191d}
.set-actions{display:flex;gap:8px;padding:0 14px 12px}
.set-actions button{border:1px solid #cfd4db;background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}
.set-actions .complete{flex:1}.set-actions .drop{flex:1}.set-actions .clock{width:44px;padding:0;font-size:18px}
.dropbox{display:none;margin:0 14px 12px;background:#f6f7f9;border-radius:10px;padding:8px}
.dropbox.open{display:block}
.dropitem{display:grid;grid-template-columns:1fr 1fr 38px;gap:6px;margin:5px 0}
.dropitem button{border:1px solid #ccd2d9;background:#fff;border-radius:8px;font-weight:900}
.dropctrl{display:flex;gap:6px;margin-top:5px}.dropctrl button{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:850}
.asc-wrap{border-top:1px solid var(--line)}
.asc-wrap summary{padding:12px 14px;font-weight:900;font-size:13px;cursor:pointer;list-style:none}
.asc-wrap summary::-webkit-details-marker{display:none}
.asc-wrap summary:before{content:"▶ ";font-size:10px}.asc-wrap[open] summary:before{content:"▼ "}
.asc-tools{display:flex;gap:7px;padding:0 14px 10px}
.asc-tools button,.main-tools button{flex:1;border:1px solid #cfd4db;background:#fff;border-radius:999px;padding:9px;font-size:11px;font-weight:900}
.main-tools{display:flex;gap:8px;padding:0 14px 12px}
.program-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.program-grid button{border:1px solid #d6dbe1;background:#fff;border-radius:11px;padding:12px;text-align:left;font-weight:900}
.action{display:flex;gap:8px}.action button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:900}.primary{background:#17191d;color:#fff}.secondary{background:#e8eaed}
#workClock{position:fixed;right:10px;bottom:96px;z-index:180;background:#fff;border:1px solid #dce1e6;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:850;box-shadow:0 3px 15px #0001}
#fixedTimer{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#fff;border-top:1px solid #e0e3e7;box-shadow:0 -6px 25px #00000012;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.timerbar{max-width:760px;margin:auto;display:grid;grid-template-columns:1.25fr .8fr .55fr;gap:8px;align-items:stretch}
.timerbox{background:#f2f3f5;border-radius:18px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.timerpart{display:grid;place-items:center;padding:8px;border-right:1px solid #dfe2e6}.timerpart:last-child{border:0}
.timerlabel{font-size:12px;font-weight:900}.timerdisplay{font-size:26px;font-weight:950;font-variant-numeric:tabular-nums}
.timerend{border:0;border-radius:18px;background:#8eb800;color:#fff;font-size:19px;font-weight:950}
.timerpanel{max-width:760px;margin:0 auto 8px;display:none;background:#fff}
.timerpanel.show{display:block}
.timerpanel-inner{border:1px solid #dfe3e8;border-radius:14px;padding:10px}
.timer-settings{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.timer-actions{display:flex;gap:6px;margin-top:7px}.timer-actions button{flex:1;border:1px solid #d4d9df;background:#fff;border-radius:9px;padding:8px;font-size:10px;font-weight:900}
.hidden{display:none!important}
@media(min-width:700px){main{padding-top:14px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden}.top{height:76px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <button onclick="goBack()">‹</button>
    <h1 id="title">Workout</h1>
    <button class="menu" onclick="toggleNav()">☰</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="workClock">トレーニング 00:00:00</div>

<div id="fixedTimer">
  <div id="timerPanel" class="timerpanel">
    <div class="timerpanel-inner">
      <div class="timer-settings">
        <div><label>セット間休憩（秒）</label><input id="restInput" type="number" min="0" max="900" step="5"></div>
        <div><label>種目間休憩（秒）</label><input id="exerciseInput" type="number" min="0" max="900" step="5"></div>
      </div>
      <div class="timer-actions">
        <button onclick="startTimer('rest')">セット間 ▶</button>
        <button onclick="startTimer('exercise')">種目間 ▶</button>
        <button onclick="stopTimer()">停止</button>
        <button onclick="resetTimer()">リセット</button>
      </div>
    </div>
  </div>
  <div class="timerbar">
    <div class="timerbox">
      <button class="timerpart" onclick="toggleTimerPanel()"><span class="timerlabel">休憩タイマー</span><span id="timerDisplay" class="timerdisplay">00:00</span></button>
      <button class="timerpart" onclick="toggleTimerPanel()"><span class="timerlabel">総時間</span><span id="totalDisplay" class="timerdisplay">00:00</span></button>
    </div>
    <button class="timerend" onclick="closeTimer()">終了</button>
    <div></div>
  </div>
</div>

<script>
const BBB={
"脚":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"胸":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"背中":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"肩":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"三頭":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""]],
"二頭":[["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]],
"前腕":[["リストカール",5,"10〜15"],["リバースリストカール",5,"10〜15"],["ハンマーカール",5,"8〜12"]],
"腹筋":[["アブドミナルマシン",5,"10〜15"],["ケーブルクランチ",5,"10〜15"],["ハンギングレッグレイズ",4,"8〜15"]]
};
const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
const PPP={};
for(let w=1;w<=4;w++)PPP[w]={
D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],
D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],
D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],
D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],
D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7")]};
PPP[5]={D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]};
PPP[6]={D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]};
PPP[7]={D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],D2:[E("Competition DL",3,"1","70〜75%")],D3:[E("Competition BP",2,"3","75%")]};
PPP[8]={"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]};

const tabs=["HOME","PRE","BBB","PPP","HISTORY"];
let current="HOME",bbbDay=localStorage.getItem("bbbDay")||"Day1",bbbPart=localStorage.getItem("bbbPart")||"脚";
let pppWeek=Number(localStorage.getItem("pppWeek")||1),pppDay=localStorage.getItem("pppDay")||"D1";
let store=JSON.parse(localStorage.getItem("pbWorkoutV23")||"{}");
let timerState=null,timerIv=null,workStarted=Number(localStorage.getItem("workStarted23")||0),workElapsed=Number(localStorage.getItem("workElapsed23")||0);
const app=document.getElementById("app"),nav=document.getElementById("nav"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const get=k=>(store[k]??={sets:{},exercises:{},savedAt:0});
const save=()=>localStorage.setItem("pbWorkoutV23",JSON.stringify(store));
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.floor(Math.max(0,s)%60)).padStart(2,"0");
const fmtWork=s=>String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(Math.floor(s)%60).padStart(2,"0");

function navDraw(){nav.innerHTML=tabs.map(t=>`<button class="${t==current?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}
function toggleNav(){nav.classList.toggle("hidden")}
function go(t){current=t;navDraw();render();window.scrollTo(0,0)}
function goBack(){if(current!="HOME")go("HOME")}
function badgeFor(name){if(name.includes("SQ")||name.includes("スクワット"))return "脚";if(name.includes("BP")||name.includes("ベンチ"))return "胸";if(name.includes("DL")||name.includes("ロウ")||name.includes("ロー"))return "背";if(name.includes("カール"))return "腕";return "種"}
function meta(k){let d=get(k);return `<div class="meta"><div><label>日付</label><input type="date" data-meta="${esc(k)}" data-f="date" value="${esc(d.date||"")}"></div><div><label>体重 kg</label><input inputmode="decimal" data-meta="${esc(k)}" data-f="weight" value="${esc(d.weight||"")}"></div><div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.sleep==n?"on":""}" onclick="choice('${esc(k)}','sleep',${n})">${n}</button>`).join("")}</div></div><div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.fatigue==n?"on":""}" onclick="choice('${esc(k)}','fatigue',${n})">${n}</button>`).join("")}</div></div></div>`}
function ensureEx(k,id,e){let d=get(k);d.exercises[id]??={name:e.name,timer:{rest:120,exercise:300},mainCount:e.sets,ascCount:3,ascOpen:false};d.exercises[id].name??=e.name;d.exercises[id].timer??={rest:120,exercise:300};d.exercises[id].mainCount??=e.sets;d.exercises[id].ascCount??=3;return d.exercises[id]}
function recent(k,id){let d=get(k),best=null;Object.keys(d.sets||{}).filter(x=>x.startsWith(id+"#")).forEach(x=>{let r=d.sets[x];if(r&&r.weight&&r.rep)best=r});return best?`${best.weight}kg × ${best.rep}`:"最近の記録"}
function dropRows(k,id,i){let d=get(k),key=id+"#"+i,arr=d.sets[key+"#drops"]||[],open=!!d.sets[key]?.dropOpen;return `<div class="dropbox ${open?"open":""}">${arr.map((r,j)=>`<div class="dropitem"><input inputmode="decimal" placeholder="kg" data-row="${esc(k)}" data-id="${esc(key+"#drops#"+j)}" data-f="weight" value="${esc(r.weight||"")}"><input inputmode="numeric" placeholder="Rep" data-row="${esc(k)}" data-id="${esc(key+"#drops#"+j)}" data-f="rep" value="${esc(r.rep||"")}"><button onclick="removeDrop('${esc(k)}','${esc(id)}',${i},${j})">×</button></div>`).join("")}<div class="dropctrl"><button onclick="addDrop('${esc(k)}','${esc(id)}',${i})">＋ Drop Set</button>${arr.length?`<button onclick="removeDrop('${esc(k)}','${esc(id)}',${i},${arr.length-1})">最後を削除</button>`:""}</div></div>`}
function setRow(k,id,i,asc=false){let d=get(k),key=asc?id+"#asc#"+i:id+"#"+i,r=d.sets[key]||{},done=!!r.completed;return `<div class="setrow"><div class="setno">${i+1}</div><input inputmode="decimal" placeholder="0" data-row="${esc(k)}" data-id="${esc(key)}" data-f="weight" value="${esc(r.weight||"")}"><input inputmode="numeric" placeholder="0" data-row="${esc(k)}" data-id="${esc(key)}" data-f="rep" value="${esc(r.rep||"")}"><button class="donebtn ${done?"done":""}" onclick="${asc?"completeAsc":"completeSet"}('${esc(k)}','${esc(id)}',${i},this)">✓</button></div>${!asc?`<div class="set-actions"><button class="complete" onclick="completeSet('${esc(k)}','${esc(id)}',${i},this)">${done?"✓ 完了":"セット完了"}</button><button class="drop" onclick="toggleDrop('${esc(k)}','${esc(id)}',${i})">ドロップ</button><button class="clock" onclick="openTimer('${esc(k)}','${esc(id)}')">🕰️</button></div>${dropRows(k,id,i)}`:`<div class="set-actions"><button class="complete" onclick="completeAsc('${esc(k)}','${esc(id)}',${i},this)">${done?"✓ 完了":"セット完了"}</button><button class="clock" onclick="openTimer('${esc(k)}','${esc(id)}')">🕰️</button></div>`}`}
function exerciseCard(k,e,index){let id="EX|"+index+"|"+e.name.replace(/[|#]/g,"_"),x=ensureEx(k,id,e),count=Math.max(1,Math.min(20,Number(x.mainCount)||1)),ac=Math.max(0,Math.min(15,Number(x.ascCount)||0));return `<div class="exercise"><div class="exhead"><div class="exline"><div class="info">i</div><div class="badge">${badgeFor(e.name)}</div><div class="exname">${esc(e.name)}</div><button class="exdelete" onclick="deleteExercise('${esc(k)}','${esc(id)}')">♧</button><button class="exmenu" onclick="swapExercise('${esc(k)}','${esc(id)}','${esc(e.name)}')">•••</button></div><div class="rx"><b>処方：</b>${e.sets}セット × ${esc(e.rep)}${e.rx?"｜"+esc(e.rx):""}${e.note?"<br>"+esc(e.note):""}</div></div><div class="worktime">00:00</div><div class="exercise-note"><input data-meta-note="${esc(k)}" placeholder="メモを入力" value="${esc(get(k).exercises[id].note||"")}"><button class="recent" onclick="showRecent('${esc(k)}','${esc(id)}')">${recent(k,id)}</button></div><details class="asc-wrap" ${x.ascOpen?"open":""} ontoggle="setAscOpen('${esc(k)}','${esc(id)}',this.open)"><summary>Ascending Set</summary>${Array.from({length:ac},(_,i)=>setRow(k,id,i,true)).join("")}<div class="asc-tools"><button onclick="changeAsc('${esc(k)}','${esc(id)}',-1)">− セット削除</button><button onclick="changeAsc('${esc(k)}','${esc(id)}',1)">＋ セット追加</button></div></details><div class="sectionbar">Main Set（${count}セット）</div>${Array.from({length:count},(_,i)=>setRow(k,id,i,false)).join("")}<div class="main-tools"><button onclick="changeMain('${esc(k)}','${esc(id)}',-1)">− セット削除</button><button onclick="changeMain('${esc(k)}','${esc(id)}',1)">＋ セット追加</button></div></div>`}

function deleteExercise(k,id){let d=get(k);delete d.exercises[id];Object.keys(d.sets).filter(x=>x.startsWith(id+"#")).forEach(x=>delete d.sets[x]);save();render()}
function swapExercise(k,id,old){let v=prompt("差し替える種目名を入力",old);if(!v)return;let d=get(k);d.exercises[id]??={};d.exercises[id].name=v;d.exercises[id].timer??={rest:120,exercise:300};save();render()}
function setAscOpen(k,id,v){let d=get(k);d.exercises[id]??={};d.exercises[id].ascOpen=!!v;save()}
function completeSet(k,id,i,btn){let d=get(k),key=id+"#"+i;d.sets[key]??={};d.sets[key].completed=!d.sets[key].completed;save();btn.classList.toggle("done",d.sets[key].completed)}
function completeAsc(k,id,i,btn){let d=get(k),key=id+"#asc#"+i;d.sets[key]??={};d.sets[key].completed=!d.sets[key].completed;save();btn.classList.toggle("done",d.sets[key].completed)}
function toggleDrop(k,id,i){let d=get(k),key=id+"#"+i;d.sets[key]??={};d.sets[key].dropOpen=!d.sets[key].dropOpen;save();render()}
function addDrop(k,id,i){let d=get(k),key=id+"#"+i+"#drops";d.sets[key]??=[];d.sets[key].push({});d.sets[id+"#"+i]??={};d.sets[id+"#"+i].dropOpen=true;save();render()}
function removeDrop(k,id,i,j){let d=get(k),key=id+"#"+i+"#drops";if(!d.sets[key])return;d.sets[key].splice(j,1);save();render()}
function changeMain(k,id,delta){let d=get(k);d.exercises[id]??={mainCount:1};d.exercises[id].mainCount=Math.max(1,Math.min(20,Number(d.exercises[id].mainCount)||1+delta));d.exercises[id].mainCount=Math.max(1,Math.min(20,(Number(d.exercises[id].mainCount)||1)+delta));save();render()}
function changeAsc(k,id,delta){let d=get(k);d.exercises[id]??={ascCount:0};d.exercises[id].ascCount=Math.max(0,Math.min(15,(Number(d.exercises[id].ascCount)||0)+delta));save();render()}
function choice(k,f,n){get(k)[f]=n;save();render()}

function openTimer(k,id){let ex=get(k).exercises[id];ex.timer??={rest:120,exercise:300};timerState={k,id,type:"rest"};document.getElementById("restInput").value=ex.timer.rest;document.getElementById("exerciseInput").value=ex.timer.exercise;document.getElementById("timerDisplay").textContent=fmt(ex.timer.rest);document.getElementById("timerPanel").classList.add("show")}
function toggleTimerPanel(){document.getElementById("timerPanel").classList.toggle("show")}
function saveTimerSetting(type){if(!timerState)return;let ex=get(timerState.k).exercises[timerState.id];ex.timer??={rest:120,exercise:300};let v=Math.max(0,Math.min(900,Number(document.getElementById(type=="rest"?"restInput":"exerciseInput").value)||0));ex.timer[type]=v;save()}
function startTimer(type){if(!timerState)return;saveTimerSetting(type);clearInterval(timerIv);timerState.type=type;let ex=get(timerState.k).exercises[timerState.id],end=Date.now()+Number(ex.timer[type]||0)*1000;const tick=()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById("timerDisplay").textContent=fmt(left);if(left<=0){clearInterval(timerIv);timerIv=null;beep()}};tick();timerIv=setInterval(tick,200)}
function stopTimer(){clearInterval(timerIv);timerIv=null}
function resetTimer(){stopTimer();if(timerState){let ex=get(timerState.k).exercises[timerState.id];document.getElementById("timerDisplay").textContent=fmt(ex.timer[timerState.type||"rest"]||0)}}
function closeTimer(){stopTimer();timerState=null;document.getElementById("timerPanel").classList.remove("show");document.getElementById("timerDisplay").textContent="00:00"}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A,o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}

function startWork(){if(!workStarted){workStarted=Date.now();localStorage.setItem("workStarted23",workStarted)}}
function stopWork(){if(workStarted){workElapsed+=Date.now()-workStarted;workStarted=0;localStorage.setItem("workStarted23",0);localStorage.setItem("workElapsed23",workElapsed)}}
function updateWorkClock(){let s=workElapsed+(workStarted?Date.now()-workStarted:0);document.getElementById("workClock").textContent="トレーニング "+fmtWork(s/1000);document.getElementById("totalDisplay").textContent=fmt(s/1000)}
setInterval(updateWorkClock,500)

function bind(){document.querySelectorAll("[data-meta]").forEach(x=>x.oninput=()=>{get(x.dataset.meta)[x.dataset.f]=x.value;save()});document.querySelectorAll("[data-row]").forEach(x=>x.oninput=()=>{get(x.dataset.row).sets[x.dataset.id]??={};get(x.dataset.row).sets[x.dataset.id][x.dataset.f]=x.value;save()});document.querySelectorAll("[data-meta-note]").forEach(x=>x.oninput=()=>{get(x.dataset.metaNote).exercises??={};let d=get(x.dataset.metaNote),ids=Object.keys(d.exercises);if(ids.length)d.exercises[ids[0]].note=x.value;save()})}
function showRecent(k,id){let d=get(k),rows=Object.entries(d.sets).filter(([key,r])=>key.startsWith(id+"#")&&r.weight&&r.rep).slice(-5);alert(rows.length?rows.map(([key,r])=>`${r.weight}kg × ${r.rep}`).join("\n"):"まだ記録なし")}
function saveDay(k){get(k).savedAt=Date.now();save();alert("保存しました")}
function endDay(k){return `<div class="cardpad"><label>当日メモ・特記事項</label><textarea data-daynote="${esc(k)}">${esc(get(k).note||"")}</textarea><div class="action"><button class="primary" onclick="saveDay('${esc(k)}')">保存</button><button class="secondary" onclick="startWork()">トレーニング開始</button></div></div>`}
function render(){
 document.getElementById("title").textContent=current=="HOME"?"Workout":current=="BBB"?"BBB":current=="PPP"?"PPP":current=="PRE"?"PRE Week 1":"履歴";
 if(current=="HOME"){app.innerHTML=`<div class="card"><div class="program-head"><h2>Workout Log</h2><div class="notice">処方・実績・Ascending・Main・Drop Set・種目別レストを一つにまとめたトレーニングログ。</div><h3>プログラムを一発呼び出し</h3><div class="program-grid"><button onclick="go('PRE')">PRE Week 1</button><button onclick="go('BBB')">BBB</button>${[1,2,3,4,5,6,7,8].map(w=>`<button onclick="pppWeek=${w};localStorage.setItem('pppWeek',${w});go('PPP')">PPP W${w}</button>`).join("")}</div><h3>トレーニング時間</h3><div class="action"><button class="primary" onclick="startWork()">開始</button><button class="secondary" onclick="stopWork()">停止</button><button class="secondary" onclick="workElapsed=0;workStarted=0;localStorage.setItem('workElapsed23',0);localStorage.setItem('workStarted23',0);updateWorkClock()">リセット</button></div></div></div>`}
 else if(current=="PRE"){let k="PRE|D1",arr=[E("High-bar SQ",1,"Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"),E("Competition BP",1,"Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"),E("Competition DL",1,"Ascending → Top 180kg × 1","必要なら185〜190kg確認")];app.innerHTML=`<div class="card"><div class="program-head"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなくBBB初期重量・フォーム・動作を校正。</div></div>${meta(k)}${arr.map((e,i)=>exerciseCard(k,e,i)).join("")}${endDay(k)}</div>`}
 else if(current=="BBB"){let days=["Day1","Day2","Day3","Day4","Day5","Day6","Day7"];let k="BBB|"+bbbDay+"|"+bbbPart;app.innerHTML=`<div class="card"><div class="program-head"><h2>BBB</h2><div class="daytabs">${days.map(d=>`<button class="${d==bbbDay?"active":""}" onclick="bbbDay='${d}';localStorage.setItem('bbbDay','${d}');render()">${d}</button>`).join("")}</div><div class="small">Dayを選択</div></div><div class="daytabs">${Object.keys(BBB).map(p=>`<button class="${p==bbbPart?"active":""}" onclick="bbbPart='${p}';localStorage.setItem('bbbPart','${p}');render()">${p}</button>`).join("")}</div>${meta(k)}${BBB[bbbPart].map((x,i)=>exerciseCard(k,E(x[0],x[1],x[2]),i)).join("")}${endDay(k)}</div>`}
 else if(current=="PPP"){let days=Object.keys(PPP[pppWeek]||{});if(!days.includes(pppDay))pppDay=days[0];let k="PPP W"+pppWeek+"|"+pppDay;app.innerHTML=`<div class="card"><div class="program-head"><h2>PPP</h2><div class="daytabs">${[1,2,3,4,5,6,7,8].map(w=>`<button class="${w==pppWeek?"active":""}" onclick="pppWeek=${w};pppDay=(Object.keys(PPP[${w}]||{})[0]||'D1');localStorage.setItem('pppWeek',${w});localStorage.setItem('pppDay',pppDay);render()">${"W"+w}</button>`).join("")}</div><div class="small">Weekを選択</div><div class="daytabs" style="padding-left:0;padding-right:0;margin-top:9px">${days.map(d=>`<button class="${d==pppDay?"active":""}" onclick="pppDay='${d}';localStorage.setItem('pppDay','${d}');render()">${d}</button>`).join("")}</div><div class="small">Dayを選択</div></div>${meta(k)}${(PPP[pppWeek][pppDay]||[]).map((e,i)=>exerciseCard(k,e,i)).join("")}${endDay(k)}</div>`}
 else {let a=Object.entries(store).filter(x=>x[1].savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);app.innerHTML=`<div class="card cardpad"><h2>履歴</h2>${a.length?a.map(([k,v])=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(k)}</b><div class="small">${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg</div></div>`).join(""):"保存履歴なし"}</div>`}
 bind();
}
document.getElementById("restInput").onchange=()=>saveTimerSetting("rest");
document.getElementById("exerciseInput").onchange=()=>saveTimerSetting("exercise");
navDraw();render();updateWorkClock();
</script>
</body>
</html>
