<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Log</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{background:#111;color:#fff;padding:13px 12px 10px;position:sticky;top:0;z-index:30}
h1{font-size:21px;margin:0} header p{font-size:12px;opacity:.72;margin:3px 0 0}
main{max-width:540px;margin:auto;padding:7px 9px 55px}
nav{position:sticky;top:61px;z-index:20;display:flex;gap:6px;overflow-x:auto;background:#f3f3f3;padding:5px 0 9px}
nav button,.daytabs button,.weektabs button{flex:0 0 auto;padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;font-weight:700}
nav button.active,.daytabs button.active,.weektabs button.active{background:#111;color:#fff;border-color:#111}
.daytabs,.weektabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 9px}
.card,.exercise{background:#fff;border:1px solid #d2d2d2;border-radius:13px;margin:9px 0}
.card{padding:12px}.exercise{overflow:hidden}
h2{font-size:19px;margin:0 0 9px}h3{font-size:16px;margin:15px 0 7px}
.small{font-size:12px;color:#666}.notice{font-size:13px;line-height:1.55;background:#f7f7f7;border-radius:9px;padding:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
label{display:block;font-size:12px;color:#666;margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;border:1px solid #c8c8c8;border-radius:9px;background:#fff;padding:9px}
textarea{min-height:68px}
.choice{display:flex;gap:4px}.choice button{flex:1;border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 2px}.choice button.on{background:#111;color:#fff}
.exhead{padding:11px;border-bottom:1px solid #ddd}.exname{font-size:17px;font-weight:800}
.rx{font-size:12px;line-height:1.5;color:#555;margin-top:4px}.rx strong{color:#111}
.set{padding:9px 10px;border-bottom:1px solid #e7e7e7}.set:last-child{border-bottom:0}
.settop{display:grid;grid-template-columns:58px 1fr 1fr 1fr;gap:6px;align-items:end}
.setno{font-size:13px;font-weight:800;padding-bottom:9px}.set input{text-align:center;padding:8px 5px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.memo{margin-top:6px}
.action{display:flex;gap:7px;margin-top:10px}.action button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;font-size:15px}
.primary{background:#111;color:#fff}.secondary{background:#e8e8e8}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
.setlabel{font-size:12px;font-weight:800}.asc-label{color:#666}.main-label{color:#111}
.setadjust{display:flex;align-items:center;gap:6px;margin-top:9px}.setadjust button{border:1px solid #ccc;background:#fff;border-radius:8px;width:38px;height:34px;font-size:20px;font-weight:800}
.setadjust span{min-width:82px;text-align:center;font-size:13px;font-weight:700}
.timerbox{padding:10px;border-top:1px solid #e7e7e7;background:#fafafa}
.timer-title{font-size:13px;font-weight:800;margin-bottom:6px}
.timer-display{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;letter-spacing:.03em;text-align:center;margin:5px 0 8px}
.timer-controls{display:flex;gap:6px}.timer-controls button{flex:1;border:1px solid #ccc;background:#fff;border-radius:8px;padding:9px;font-weight:800}
.timer-controls button.primary{border-color:#111}
.timer-setting{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.timer-setting input{text-align:center}
.timer-status{font-size:11px;color:#666;text-align:center;margin-top:5px;min-height:15px}
.workoutbar{position:sticky;bottom:8px;z-index:15;background:#fff;border:1px solid #ccc;border-radius:12px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.workoutbar-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.workouttime{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.workoutbar button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;font-weight:800}
.breakbox{margin-top:10px;border-top:1px solid #ddd;padding-top:10px}
.break-title{font-size:13px;font-weight:800}
.timer-global{background:#fff;border:1px solid #d2d2d2;border-radius:13px;padding:12px;margin:9px 0}
.sound-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;margin-top:7px}
.sound-toggle input{width:auto}
@media(max-width:380px){
.settop{grid-template-columns:50px 1fr 1fr 1fr}.set input{font-size:14px}
}
</style>
</head>
<body>
<header><h1>Workout Log</h1><p>Power Building｜PRE → BBB → PPP W1〜W8 → TEST</p></header>
<main><nav id="nav"></nav><div id="app"></div></main>
<script>
const tabs=["HOME","PRE","BBB","PPP","HISTORY"];
const PPP_WEEKS=["PPP W1","PPP W2","PPP W3","PPP W4","PPP W5","PPP W6","PPP W7","PPP W8"];

const BBB={
"Legs":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"Chest":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"Shoulders":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"Back":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"Arms":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""],["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]]
};

const PRE=[
["High-bar SQ","Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"],
["Competition BP","Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"],
["Competition DL","Ascending → Top 180kg × 1","必要なら185〜190kg確認"]
];

const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
const P={};

for(let w=1;w<=4;w++)P["PPP W"+w]={
D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],
D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],
D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],
D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],
D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7","低疲労")]
};

P["PPP W5"]={
D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],
D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],
D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],
D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],
D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]
};

P["PPP W6"]={
D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],
D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],
D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],
D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]
};

P["PPP W7"]={
D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],
D2:[E("Competition DL",3,"1","70〜75%")],
D3:[E("Competition BP",2,"3","75%")]
};

P["PPP W8"]={
"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],
"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]
};

let current="HOME";
let selectedPPP=localStorage.getItem("selectedPPP")||"PPP W1";
let store=JSON.parse(localStorage.getItem("pbWorkoutV4")||"{}");
const nav=document.getElementById("nav"),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const get=k=>(store[k]??={sets:{},timers:{}});
const save=()=>localStorage.setItem("pbWorkoutV4",JSON.stringify(store));

let audioCtx=null;
let workoutTimer=null;
let workoutElapsed=0;
let workoutRunning=false;

const activeTimers={};

function beep(){
  if(localStorage.getItem("timerSound")==="off") return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine";o.frequency.value=880;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);
  }catch(e){}
}

function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function timerState(k,type){
  const d=get(k); d.timers??={};
  d.timers[type]??={setting:type==="rest"?120:300,remaining:type==="rest"?120:300,running:false};
  return d.timers[type];
}

function timerStart(k,type){
  const key=k+"|"+type;
  const t=timerState(k,type);
  if(t.remaining<=0)t.remaining=t.setting;
  t.running=true;
  t.startedAt=Date.now();
  activeTimers[key]=setInterval(()=>{
    const left=Math.max(0,t.setting-Math.floor((Date.now()-t.startedAt)/1000)+(t.remaining-t.setting));
    t.remaining=left;
    if(left<=0){
      clearInterval(activeTimers[key]);delete activeTimers[key];
      t.running=false;t.remaining=0;save();render();beep();
    }else{save();updateTimerDisplays(k,type)}
  },250);
  save();render();
}

function timerPause(k,type){
  const key=k+"|"+type,t=timerState(k,type);
  if(activeTimers[key]){clearInterval(activeTimers[key]);delete activeTimers[key]}
  if(t.running){
    const elapsed=Math.floor((Date.now()-t.startedAt)/1000);
    t.remaining=Math.max(0,t.remaining-elapsed);
  }
  t.running=false;save();render();
}

function timerReset(k,type){
  const key=k+"|"+type,t=timerState(k,type);
  if(activeTimers[key]){clearInterval(activeTimers[key]);delete activeTimers[key]}
  t.running=false;t.remaining=t.setting;save();render();
}

function timerSet(k,type,v){
  let n=Math.max(0,Math.min(900,Math.round(Number(v)||0)));
  const t=timerState(k,type);
  if(t.running) timerPause(k,type);
  t.setting=n;t.remaining=n;save();render();
}

function updateTimerDisplays(k,type){
  const t=timerState(k,type);
  document.querySelectorAll(`[data-timer-display="${esc(k)}|${type}"]`).forEach(x=>x.textContent=fmt(t.remaining));
}

function timerUI(k,type,title){
  const t=timerState(k,type);
  return `<div class="timerbox">
    <div class="timer-title">${title}</div>
    <div class="timer-setting">
      <div><label>設定（分）</label><input inputmode="decimal" min="0" max="15" step=".5" value="${esc((t.setting/60).toString())}" onchange="timerSet('${esc(k)}','${type}',Number(this.value)*60)"></div>
      <div><label>最大</label><input value="15:00" disabled></div>
    </div>
    <div class="timer-display" data-timer-display="${esc(k)}|${type}">${fmt(t.remaining)}</div>
    <div class="timer-controls">
      <button class="primary" onclick="timerStart('${esc(k)}','${type}')">開始</button>
      <button onclick="timerPause('${esc(k)}','${type}')">一時停止</button>
      <button onclick="timerReset('${esc(k)}','${type}')">リセット</button>
    </div>
    <div class="timer-status">${t.running?"計測中":"待機中"}｜終了時に1回だけ音</div>
  </div>`;
}

function workoutStart(){
  if(!workoutRunning){
    workoutRunning=true;localStorage.setItem("workoutRunning","1");
    const started=Number(localStorage.getItem("workoutStartedAt")||0);
    if(!started)localStorage.setItem("workoutStartedAt",Date.now());
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }
  render();
}

function workoutPause(){
  const started=Number(localStorage.getItem("workoutStartedAt")||0);
  if(workoutRunning&&started)workoutElapsed+=Math.floor((Date.now()-started)/1000);
  workoutRunning=false;localStorage.removeItem("workoutStartedAt");localStorage.setItem("workoutElapsed",workoutElapsed);
  render();
}

function workoutFinish(){
  const started=Number(localStorage.getItem("workoutStartedAt")||0);
  if(workoutRunning&&started)workoutElapsed+=Math.floor((Date.now()-started)/1000);
  workoutRunning=false;
  const key=logKeyForCurrent();
  if(key){
    get(key).workoutTime=workoutElapsed;
    get(key).savedAt=Date.now();
    save();
  }
  workoutElapsed=0;localStorage.removeItem("workoutStartedAt");localStorage.removeItem("workoutElapsed");localStorage.removeItem("workoutRunning");
  render();alert("トレーニング時間を保存しました");
}

function logKeyForCurrent(){
  if(current==="BBB"){
    const d=localStorage.getItem("bbbDay")||"Legs";return "BBB|"+d;
  }
  if(current==="PPP") return selectedPPP+"|"+(localStorage.getItem("pppDay")||Object.keys(P[selectedPPP]||{})[0]||"D1");
  if(current==="PRE") return "PRE|D1";
  return null;
}

function workoutBar(){
  if(!["PRE","BBB","PPP"].includes(current))return "";
  if(!workoutRunning)workoutElapsed=Number(localStorage.getItem("workoutElapsed")||0);
  const started=Number(localStorage.getItem("workoutStartedAt")||0);
  const nowTime=workoutRunning&&started?workoutElapsed+Math.floor((Date.now()-started)/1000):workoutElapsed;
  return `<div class="workoutbar">
    <div class="workoutbar-top">
      <div><div class="small">トレーニング時間</div><div class="workouttime" id="workoutClock">${fmt(nowTime)}</div></div>
      <div>
        ${workoutRunning?`<button onclick="workoutPause()">一時停止</button>`:`<button class="primary" onclick="workoutStart()">開始</button>`}
        <button onclick="workoutFinish()">終了・保存</button>
      </div>
    </div>
    <div class="sound-toggle"><input type="checkbox" ${localStorage.getItem("timerSound")!=="off"?"checked":""} onchange="localStorage.setItem('timerSound',this.checked?'on':'off')"> タイマー終了音</div>
  </div>`;
}

function navDraw(){
  nav.innerHTML=tabs.map(t=>`<button class="${t==current?"active":""}" onclick="go('${t}')">${t}</button>`).join("");
}
function go(t){current=t;navDraw();render();scrollTo(0,0)}
function meta(k){
  let d=get(k);
  return `<div class="meta">
    <div><label>日付</label><input type="date" data-meta="${esc(k)}" data-f="date" value="${esc(d.date||"")}"></div>
    <div><label>体重 kg（任意）</label><input inputmode="decimal" data-meta="${esc(k)}" data-f="weight" value="${esc(d.weight||"")}"></div>
  </div>
  <div class="meta">
    <div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.sleep==n?"on":""}" onclick="choice('${esc(k)}','sleep',${n})">${n}</button>`).join("")}</div></div>
    <div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${d.fatigue==n?"on":""}" onclick="choice('${esc(k)}','fatigue',${n})">${n}</button>`).join("")}</div></div>
  </div>`;
}

function row(k,e,i){
  let d=get(k),id=e.name+"#"+i,r=d.sets[id]||{};
  return `<div class="set">
    <div class="settop">
      <div class="setno"><span class="setlabel main-label">Main ${i+1}</span></div>
      <div><label>重量 kg</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(id)}" data-f="weight" value="${esc(r.weight||"")}"></div>
      <div><label>Rep</label><input inputmode="numeric" data-row="${esc(k)}" data-id="${esc(id)}" data-f="rep" value="${esc(r.rep||"")}"></div>
      <div><label>RPE</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(id)}" data-f="rpe" value="${esc(r.rpe||"")}"></div>
    </div>
    <div class="formrow">
      <div><label>フォーム</label><select data-row="${esc(k)}" data-id="${esc(id)}" data-f="form"><option value="">—</option><option ${r.form=="◎"?"selected":""}>◎</option><option ${r.form=="○"?"selected":""}>○</option><option ${r.form=="△"?"selected":""}>△</option><option ${r.form=="×"?"selected":""}>×</option></select></div>
      <div><label>メモ</label><input data-row="${esc(k)}" data-id="${esc(id)}" data-f="memo" value="${esc(r.memo||"")}"></div>
    </div>
  </div>`;
}

function ascRow(k,e,i){
  let d=get(k),id="ASC|"+e.name+"#"+i,r=d.sets[id]||{};
  return `<div class="set">
    <div class="settop">
      <div class="setno"><span class="setlabel asc-label">Ascending ${i+1}</span></div>
      <div><label>重量 kg</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(id)}" data-f="weight" value="${esc(r.weight||"")}"></div>
      <div><label>Rep</label><input inputmode="numeric" data-row="${esc(k)}" data-id="${esc(id)}" data-f="rep" value="${esc(r.rep||"")}"></div>
      <div><label>RPE</label><input inputmode="decimal" data-row="${esc(k)}" data-id="${esc(id)}" data-f="rpe" value="${esc(r.rpe||"")}"></div>
    </div>
    <div class="formrow">
      <div><label>フォーム</label><select data-row="${esc(k)}" data-id="${esc(id)}" data-f="form"><option value="">—</option><option ${r.form=="◎"?"selected":""}>◎</option><option ${r.form=="○"?"selected":""}>○</option><option ${r.form=="△"?"selected":""}>△</option><option ${r.form=="×"?"selected":""}>×</option></select></div>
      <div><label>メモ</label><input data-row="${esc(k)}" data-id="${esc(id)}" data-f="memo" value="${esc(r.memo||"")}"></div>
    </div>
  </div>`;
}

function card(k,e,isBBB=false){
  let d=get(k);
  if(isBBB){d.bbbSets??={};d.bbbSets[e.name]??=e.sets;}
  let setCount=isBBB?d.bbbSets[e.name]:e.sets;
  let rows="";for(let i=0;i<setCount;i++)rows+=row(k,{...e,sets:setCount},i);
  let asc="";for(let i=0;i<3;i++)asc+=ascRow(k,e,i);
  let adjust=isBBB?`<div class="setadjust"><button onclick="changeBBBSet('${esc(k)}','${esc(e.name)}',-1)">−</button><span>${setCount} Main Set</span><button onclick="changeBBBSet('${esc(k)}','${esc(e.name)}',1)">＋</button></div>`:"";
  return `<div class="exercise">
    <div class="exhead">
      <div class="exname">${esc(e.name)}</div>
      <div class="rx"><strong>処方：</strong>${e.sets}セット × ${esc(e.rep)}${e.rx?"｜"+esc(e.rx):""}${e.note?"<br>"+esc(e.note):""}</div>
      ${adjust}
    </div>
    <details class="asc"><summary>▶ Ascending Set（キャリブレーション）</summary>${asc}</details>
    ${rows}
    ${timerUI(k,"rest","セット間レスト")}
    ${timerUI(k,"exercise","種目間休憩")}
  </div>`;
}

function end(k){
  let d=get(k);
  return `<label>当日メモ・特記事項</label><textarea data-note="${esc(k)}">${esc(d.note||"")}</textarea><div class="action"><button class="primary" onclick="commit('${esc(k)}')">保存</button><button class="secondary" onclick="resetDay('${esc(k)}')">リセット</button></div>`;
}

function bind(){
  document.querySelectorAll("[data-meta]").forEach(x=>x.oninput=()=>{get(x.dataset.meta)[x.dataset.f]=x.value;save()});
  document.querySelectorAll("[data-note]").forEach(x=>x.oninput=()=>{get(x.dataset.note).note=x.value;save()});
  document.querySelectorAll("[data-row]").forEach(x=>x.oninput=()=>{get(x.dataset.row).sets[x.dataset.id]??={};get(x.dataset.row).sets[x.dataset.id][x.dataset.f]=x.value;save()});
}

function bbbDay(n){localStorage.setItem("bbbDay",n);render()}
function pppDay(n){localStorage.setItem("pppDay",n);render()}
function pppWeek(n){selectedPPP=n;localStorage.setItem("selectedPPP",n);localStorage.removeItem("pppDay");render()}
function choice(k,f,n){get(k)[f]=n;save();render()}
function weekPick(v){localStorage.setItem("selectedWeek",v)}
function datePick(v){localStorage.setItem("selectedDate",v)}
function commit(k){get(k).savedAt=Date.now();save();alert("保存しました")}
function resetDay(k){
  if(confirm("この日の入力をリセットしますか？")){
    delete store[k];save();
    if(activeTimers[k+"|rest"])clearInterval(activeTimers[k+"|rest"]);
    if(activeTimers[k+"|exercise"])clearInterval(activeTimers[k+"|exercise"]);
    render();
  }
}

function render(){
  if(current=="HOME"){
    app.innerHTML=`<div class="card"><h2>Workout Log</h2><div class="notice">処方と実績を分離。Ascending / Main / 種目別レスト / 種目間休憩 / トレーニング時間を記録。</div><h3>Week / 日付</h3><div class="meta"><div><label>Week</label><select onchange="weekPick(this.value)"><option>PRE</option><option>BBB W1</option><option>BBB W2</option><option>BBB W3</option><option>BBB W4</option><option>BBB W5</option><option>PPP W1</option><option>PPP W2</option><option>PPP W3</option><option>PPP W4</option><option>PPP W5</option><option>PPP W6</option><option>PPP W7</option><option>PPP W8</option></select></div><div><label>日付</label><input type="date" onchange="datePick(this.value)"></div></div><div class="notice">PPPは週タブを開いてから、その週のDayを選択する構造。画面の集中を優先。</div></div>`;
  }
  else if(current=="PRE"){
    let k="PRE|D1";
    app.innerHTML=`<div class="card"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなく、BBB初期重量・フォーム・動作を校正。</div>${meta(k)}${PRE.map(x=>card(k,{name:x[0],sets:1,rep:x[1],rx:x[2]})).join("")}${end(k)}</div>${workoutBar()}`;
  }
  else if(current=="BBB"){
    const days=[["月","Legs"],["水","Chest"],["木","Shoulders"],["土","Back"],["日","Arms"]];
    const sel=localStorage.getItem("bbbDay")||"Legs";
    let pair=days.find(x=>x[1]==sel)||days[0],k="BBB|"+pair[1];
    app.innerHTML=`<div class="card"><h2>BBB</h2><div class="daytabs">${days.map(([d,n])=>`<button class="${n==pair[1]?"active":""}" onclick="bbbDay('${esc(n)}')">${d} ${n}</button>`).join("")}</div><div class="small">曜日タブで切替。スクロールで別日へ移動しない。</div></div><div class="card"><h2>${pair[0]}：${pair[1]}</h2>${meta(k)}${BBB[pair[1]].map(x=>card(k,{name:x[0],sets:x[1],rep:x[2]},true)).join("")}${end(k)}</div>${workoutBar()}`;
  }
  else if(current=="PPP"){
    const days=Object.keys(P[selectedPPP]||{});
    const day=localStorage.getItem("pppDay")||days[0];
    const actualDay=days.includes(day)?day:days[0];
    const k=selectedPPP+"|"+actualDay;
    app.innerHTML=`<div class="card"><h2>PPP</h2><div class="weektabs">${PPP_WEEKS.map(w=>`<button class="${w==selectedPPP?"active":""}" onclick="pppWeek('${w}')">${w.replace("PPP ","")}</button>`).join("")}</div><div class="small">Weekをタブで切替。週ごとの画面を分離。</div></div><div class="card"><h2>${selectedPPP}</h2><div class="daytabs">${days.map(d=>`<button class="${d==actualDay?"active":""}" onclick="pppDay('${esc(d)}')">${esc(d)}</button>`).join("")}</div><div class="small">Dayをタブで切替。</div></div><div class="card"><h2>${actualDay}</h2><div class="notice">処方どおりの種目・セットを表示。実績は下段へ入力。</div>${meta(k)}${P[selectedPPP][actualDay].map(e=>card(k,e)).join("")}${end(k)}</div>${workoutBar()}`;
  }
  else if(current=="HISTORY"){
    let a=Object.entries(store).filter(x=>x[1].savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);
    app.innerHTML=`<div class="card"><h2>履歴</h2><div class="small">この端末のブラウザに保存。</div></div>`+(a.length?a.map(([k,v])=>`<div class="card"><b>${esc(k)}</b><div class="small">${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg｜トレーニング時間 ${fmt(v.workoutTime||0)}</div></div>`).join(""):"<div class='card'>保存履歴なし</div>");
  }
  bind();
  if(workoutRunning) setTimeout(workoutTick,250);
}

function workoutTick(){
  const el=document.getElementById("workoutClock");
  if(!el||!workoutRunning)return;
  const started=Number(localStorage.getItem("workoutStartedAt")||0);
  el.textContent=fmt(workoutElapsed+(started?Math.floor((Date.now()-started)/1000):0));
  setTimeout(workoutTick,500);
}

workoutRunning=localStorage.getItem("workoutRunning")==="1";
workoutElapsed=Number(localStorage.getItem("workoutElapsed")||0);
navDraw();render();
</script>
</body>
</html>
