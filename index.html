function exercisePart(name){

  if(/DL|デッド|ロウ|ロー|ラット|懸垂|チンニング|T.?bar|Tバ|プルオーバー|フェイスプル/.test(name))return '背中';
  if(/OHP|ショルダー|サイド|リア|アップライト|シュラッグ|ランドマイン/.test(name))return '肩';
  if(/JM|トライセプス|プレスダウン|エクステンション|ナローベンチ/.test(name))return '三頭';
  if(/カール|プリーチャー|ハンマー|ゾットマン|スパイダー/.test(name))return '二頭';

function showRecent(k,id){
  const s=session(k),rows=[];
  (s.history||[]).slice().reverse().forEach(v=>{
    const ex=v.data?.exercises?.[id],sets=ex?.sets||{};
    const vals=Object.entries(sets)
      .filter(([kk,r])=>kk.startsWith('main#')&&r&&r.weight!==''&&r.rep!=='')
      .sort((a,b)=>Number(a[0].split('#')[1])-Number(b[0].split('#')[1]))
      .map(([kk,r])=>`${r.weight}kg × ${r.rep}${r.rpe?` (RPE ${r.rpe})`:''}`);
    if(vals.length)rows.push(`${v.date||'—'}：${vals.join(' / ')}`);
  });
  alert(rows.slice(0,10).join('\n')||'まだ記録なし');
}
function currentExercises(){
  let list;
  if(state.page==='PRE')list=[E('High-bar SQ',1,'4〜6','Ascending → Top 135kg','Back-off：Top −5kg'),E('Competition BP',1,'4〜6','Ascending → Top 85kg','Back-off：Top −2.5kg'),E('Competition DL',1,'1','Ascending → Top 180kg','必要なら185〜190kg確認')];
  else if(state.page==='BBB')list=(BBB_DAYS[state.bbbDay]?.ex||[]).map(a=>E(a[0],a[1],a[2],a[3]||'',BBB_DAYS[state.bbbDay]?.purpose||''));
  else list=PPP[state.pppWeek]?.[state.pppDay]||[];
  const ss=session(key());
  return list.filter((e,i)=>!ss.exercises?.['ex'+i]?.hidden);
}
function programHeader(){
  if(state.page==='BBB'){
    const dayNames={1:'Legs',2:'Conga',3:'Chest',4:'Shoulders',5:'Conga',6:'Back + Conga',7:'Arms + Timbales'};
    return `<div class="panel-head"><h2>BBB　Day ${state.bbbDay}　${esc(dayNames[state.bbbDay]||'')}</h2><div class="small">${esc(BBB_DAYS[state.bbbDay]?.purpose||'')}</div></div><div class="tabs">${[1,2,3,4,5,6,7].map(d=>`<button class="${state.bbbDay===d?'active':''}" onclick="changeBBBDay(${d})">Day ${d}</button>`).join('')}</div>`;
  }
  if(state.page==='PPP'){
    const days=Object.keys(PPP[state.pppWeek]||{});
    return `<div class="panel-head"><h2>PPP　W${state.pppWeek}</h2><div class="tabs tight">${[1,2,3,4,5,6,7,8].map(w=>`<button class="${state.pppWeek===w?'active':''}" onclick="changePPPWeek(${w})">W${w}</button>`).join('')}</div><div class="tabs">${days.map(d=>`<button class="${state.pppDay===d?'active':''}" onclick="changePPPDay('${esc(d)}')">${esc(d)}</button>`).join('')}</div></div>`;
  }
  return `<div class="panel-head"><h2>${state.page==='PRE'?'PRE Week 1':'Training'}</h2></div>`;
}
function renderProgram(){const k=key(),ex=currentExercises();document.getElementById('title').textContent=state.page==='BBB'?'BBB Day '+state.bbbDay+'　'+state.bbbPart:state.page==='PPP'?'PPP W'+state.pppWeek+' '+state.pppDay:state.page==='PRE'?'PRE Week 1':'Training';document.getElementById('app').innerHTML=`<div class="card">${programHeader()}${metaHTML(k)}${ex.map((e,i)=>exerciseCard(k,e,i)).join('')}<div class="panel-head"><label>当日メモ・特記事項</label><textarea oninput="setMeta('${esc(k)}','note',this.value)">${esc(session(k).note||'')}</textarea></div><div class="day-actions"><button class="primary" onclick="saveDay('${esc(k)}')">記録を保存</button><button class="secondary" onclick="saveAndReset('${esc(k)}')">保存して新規開始</button><button class="secondary" onclick="resetCurrent('${esc(k)}')">現在の記録をリセット</button></div></div>`}
function renderHome(){document.getElementById('title').textContent=new Date().getMonth()+1+'月'+new Date().getDate()+'日　トレーニング';document.getElementById('app').innerHTML=`<div class="card"><div class="panel-head"><h2>Workout Log</h2><div class="notice">処方と実績を分離。Main / Ascending / セット別Drop / BBB / PPPを一つにまとめたログ。</div><h3>プログラムから一発呼び出し</h3><div class="program-grid"><button onclick="go('PRE')">PRE Week 1</button><button onclick="state.bbbDay=1;state.bbbPart='Legs';go('BBB')">BBB</button>${[1,2,3,4,5,6,7,8].map(w=>`<button onclick="state.pppWeek=${w};state.pppDay=Object.keys(PPP[${w}]||{})[0]||'D1';go('PPP')">PPP W${w}</button>`).join('')}</div></div></div>`}
function renderHistory(){
  const arr=[];
  Object.entries(db.sessions).forEach(([k,s])=>(s.history||[]).forEach((h,i)=>arr.push({k,s,h,i})));
  arr.sort((a,b)=>b.h.savedAt-a.h.savedAt);
  document.getElementById('title').textContent='記録';

  const programOf=k=>k.startsWith('BBB|')?'BBB':k.startsWith('PPP|')?'PPP':'PRE';
  const dayOf=k=>{
    if(k.startsWith('BBB|'))return 'Day '+(Number((k.split('|')[1]||'D1').replace('D',''))||1);
    if(k.startsWith('PPP|'))return 'W'+(k.split('|')[1]?.replace('W','')||'')+' '+(k.split('|')[2]||'');
    return 'Week 1';
  };
  const records=o=>{
    const exs=Object.values(o.h.data?.exercises||{}).filter(x=>x&&!x.hidden);
    return exs.map((x,i)=>{
      const sets=Object.values(x.sets||{}).filter(r=>r&&r.weight!==''&&r.rep!=='');
      return `<div class="record-exercise" onclick="this.classList.toggle('open')">
        <div class="record-exercise-head">
          <strong>${esc(x.name||'種目')}</strong>
          <span>${sets.length}セット　⌄</span>
        </div>
        <div class="record-exercise-detail">
          ${sets.length?sets.map((r,j)=>`<div class="record-set"><span>Set ${j+1}</span><span>${esc(String(r.weight))} kg × ${esc(String(r.rep))}${r.rpe!==''&&r.rpe!=null?`　RPE ${esc(String(r.rpe))}`:''}</span></div>`).join(''):'<div class="small">記録なし</div>'}
        </div>
      </div>`;
    }).join('');
  };

  const rows=arr.map((o,idx)=>{
    const prog=programOf(o.k), day=dayOf(o.k);
    return `<div class="history-row">
      <div class="history-top"><strong>${prog}</strong><span>${esc(day)}</span></div>
      <div class="history-date">${esc(o.h.date||'日付未入力')}</div>
      <div class="history-exercises">${records(o)||'<div class="empty">種目記録なし。</div>'}</div>
      <div class="history-bottom"><button type="button" onclick="event.stopPropagation();openHistory(${idx})">この記録を開く</button></div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML=`<div class="card record-page">
    <div class="panel-head">
      <h2>記録</h2>
      <div class="small">種目をタップするとセット記録を展開。</div>
    </div>
    <div class="record-count">${arr.length}件</div>
    <div class="history-list">${rows||'<div class="empty">保存した記録はまだありません。</div>'}</div>
  </div>`;
  window._history=arr;
}
function restoreExercises(k){Object.values(session(k).exercises||{}).forEach(x=>x.hidden=false);save();render();toast('閉じた種目を戻しました')}
function saveDay(k){
  const s=session(k);
  s.history??=[];
  s.history.push({savedAt:Date.now(),date:s.date,label:k,data:JSON.parse(JSON.stringify(s))});
  s.savedAt=Date.now();save();toast('記録を保存しました');
}
function saveAndReset(k){
  const s=session(k),history=s.history||[];
  history.push({savedAt:Date.now(),date:s.date,label:k,data:JSON.parse(JSON.stringify(s))});
  db.sessions[k]={date:'',weight:'',note:'',exercises:{},savedAt:0,history};
  save();render();scrollTo(0,0);toast('保存して新しい記録を開始しました');
}
function resetCurrent(k){
  if(!confirm('現在の未保存記録をリセットしますか？'))return;
  const history=session(k).history||[];
  db.sessions[k]={date:'',weight:'',note:'',exercises:{},savedAt:0,history};
  save();render();scrollTo(0,0);
}
function openHistory(i){const o=window._history?.[i];if(!o)return;const h=o.h.data;db.sessions[o.k]=JSON.parse(JSON.stringify(h));db.sessions[o.k].history=o.s.history||[];if(o.k.startsWith('BBB|')){const q=o.k.split('|');state.page='BBB';state.bbbDay=Number((q[1]||'D1').replace('D',''))||1;state.bbbPart=q[2]||BBB_DAYS[state.bbbDay]?.name||'Legs'}else if(o.k.startsWith('PPP|')){const q=o.k.split('|');state.page='PPP';state.pppWeek=Number(q[1].slice(1));state.pppDay=q[2]}else state.page='PRE';save();render();scrollTo(0,0)}

function render(){navDraw();if(state.page==='HOME')renderHome();else if(state.page==='RECORD')renderHistory();else renderProgram()}render();
</script></body></html>
