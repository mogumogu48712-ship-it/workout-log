<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Workout Log Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 12px 10px}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:#777;margin-top:2px}
main{max-width:520px;margin:auto;padding:10px 10px 70px}
nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
nav button{white-space:nowrap;border:0;border-radius:9px;padding:9px 12px;background:#e9e9e9;font-size:14px}
nav button.active{background:#111;color:#fff}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin:9px 0}
.day{font-size:17px;font-weight:700}.small{font-size:12px;color:#777}
h2{font-size:16px;margin:15px 2px 8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid #ccc;background:#fff;border-radius:10px;padding:10px 2px;font-size:15px}
.scale button.on{background:#111;color:#fff;border-color:#111}
.set{display:grid;grid-template-columns:38px 1fr 1fr 1fr;gap:6px;align-items:end;margin:7px 0}
.setno{font-size:12px;color:#777;padding-bottom:10px}
label{display:block;font-size:10px;color:#777;margin:0 0 3px 2px}
input,textarea{width:100%;border:1px solid #ccc;border-radius:9px;background:#fff;padding:9px;font-size:16px;min-height:42px}
textarea{min-height:58px;margin-top:6px}
.save{font-size:12px;color:#347a3c;margin-top:5px}
.reset{margin-top:8px;border:0;background:#eee;border-radius:9px;padding:9px 12px;font-size:13px}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.set{grid-template-columns:32px 1fr 1fr 1fr;gap:5px}input{padding:8px 6px}}
</style>
</head>
<body>
<header><h1>Workout Log</h1><div class="sub">試作版｜タップして記録</div></header>
<main>
<nav id="tabs"></nav>
<section class="card">
  <div class="day">今日のコンディション</div>
  <div class="small">トレーニング前に1回だけ入力</div>
  <h2>睡眠</h2><div class="scale" id="sleep"></div>
  <h2>疲労</h2><div class="scale" id="fatigue"></div>
  <div class="save" id="status"></div>
</section>
<div id="workout"></div>
</main>
<script>
const days=[
["Day 1",[["Bench Press",3],["Squat",3],["Deadlift",3],["Stiff-leg Deadlift",3]]],
["Day 2",[["Larsen Bench",3]]],
["Day 3",[["Squat",3],["Bench Press",3]]],
["Day 4",[["Deadlift",3]]],
["Day 5",[["Squat",3],["Bench Press",3]]]
];
let active=0;
const tabs=document.getElementById("tabs"),workout=document.getElementById("workout"),status=document.getElementById("status");
days.forEach((d,i)=>{let b=document.createElement("button");b.textContent=d[0];b.onclick=()=>{active=i;render()};tabs.appendChild(b)});
function storage(k){return localStorage.getItem(k)||""}
function setScale(id,label){
 const box=document.getElementById(id);
 for(let n=1;n<=5;n++){
   let b=document.createElement("button");b.textContent=n;
   b.onclick=()=>{localStorage.setItem("condition-"+id,n);renderCondition()};
   box.appendChild(b);
 }
}
function renderCondition(){
 ["sleep","fatigue"].forEach(id=>{
   let v=storage("condition-"+id);
   [...document.getElementById(id).children].forEach((b,i)=>b.classList.toggle("on",String(i+1)===v));
 });
 let s=storage("condition-sleep"),f=storage("condition-fatigue");
 status.textContent=(s&&f)?`保存済み　睡眠 ${s} / 疲労 ${f}`:"";
}
setScale("sleep","");setScale("fatigue","");renderCondition();

function render(){
 [...tabs.children].forEach((b,i)=>b.classList.toggle("active",i===active));
 workout.innerHTML="";
 const [day,exs]=days[active];
 let card=document.createElement("section");card.className="card";
 card.innerHTML=`<div class="day">${day}</div><div class="small">セット記録</div>`;
 exs.forEach((ex,ei)=>{
   let block=document.createElement("div");
   block.innerHTML=`<h2>${ex[0]}</h2>`;
   for(let si=0;si<ex[1];si++){
     let prefix=`${day}|${ei}|${si}|`;
     let row=document.createElement("div");row.className="set";
     row.innerHTML=`<div class="setno">Set<br>${si+1}</div>
       <div><label>重量 kg</label><input inputmode="decimal" data-k="${prefix}w" value="${storage(prefix+"w")}"></div>
       <div><label>Rep</label><input inputmode="numeric" data-k="${prefix}r" value="${storage(prefix+"r")}"></div>
       <div><label>RPE</label><input inputmode="decimal" data-k="${prefix}e" value="${storage(prefix+"e")}"></div>`;
     row.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{localStorage.setItem(inp.dataset.k,inp.value)});
     block.appendChild(row);
   }
   let memo=document.createElement("textarea");memo.placeholder="フォーム・メモ（任意）";
   let mk=`${day}|${ei}|memo`;memo.value=storage(mk);memo.oninput=()=>localStorage.setItem(mk,memo.value);
   block.appendChild(memo);card.appendChild(block);
 });
 let r=document.createElement("button");r.className="reset";r.textContent="このDayの入力をリセット";
 r.onclick=()=>{if(confirm("このDayの記録を消しますか？")){Object.keys(localStorage).filter(k=>k.startsWith(day+"|")).forEach(k=>localStorage.removeItem(k));render()}};
 card.appendChild(r);workout.appendChild(card);
}
render();
</script>
</body>
</html>
