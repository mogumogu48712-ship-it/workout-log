<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Log</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{background:#111;color:#fff;padding:13px 12px 10px;position:sticky;top:0;z-index:30}
h1{font-size:21px;margin:0}header p{font-size:12px;opacity:.72;margin:3px 0 0}
main{max-width:540px;margin:auto;padding:7px 9px 55px}
nav{position:sticky;top:61px;z-index:20;display:flex;gap:6px;overflow-x:auto;background:#f3f3f3;padding:5px 0 9px}
nav button,.daytabs button,.weektabs button{flex:0 0 auto;padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff;font-weight:700}
nav button.active,.daytabs button.active,.weektabs button.active{background:#111;color:#fff;border-color:#111}
.card,.exercise{background:#fff;border:1px solid #d2d2d2;border-radius:13px;margin:9px 0}
.card{padding:12px}.exercise{overflow:hidden}
h2{font-size:19px;margin:0 0 9px}h3{font-size:16px;margin:15px 0 7px}
.small{font-size:12px;color:#666}.notice{font-size:13px;line-height:1.55;background:#f7f7f7;border-radius:9px;padding:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
label{display:block;font-size:12px;color:#666;margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;border:1px solid #c8c8c8;border-radius:9px;background:#fff;padding:9px}
textarea{min-height:68px}
.choice{display:flex;gap:4px}.choice button{flex:1;border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 2px}.choice button.on{background:#111;color:#fff}
.daytabs,.weektabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 9px;padding-bottom:2px}
.exhead{padding:11px;border-bottom:1px solid #ddd;position:relative}
.exname{font-size:17px;font-weight:800;padding-right:165px}
.rx{font-size:12px;line-height:1.5;color:#555;margin-top:4px;padding-right:165px}.rx strong{color:#111}
.set{padding:9px 10px;border-bottom:1px solid #e7e7e7}.set:last-child{border-bottom:0}
.settop{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:6px;align-items:end}
.setno{font-size:13px;font-weight:800;padding-bottom:9px}.set input{text-align:center;padding:8px 5px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.action{display:flex;gap:7px;margin-top:10px}.action button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;font-size:15px}
.primary{background:#111;color:#fff}.secondary{background:#e8e8e8}
.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
details.asc{border-top:1px solid #e2e2e2;padding:0 10px 8px}
details.asc summary{cursor:pointer;padding:10px 0;font-weight:750;font-size:13px}
.sectiontitle{padding:9px 10px 0;font-size:12px;font-weight:800;color:#555;background:#fafafa}
.countctl{display:flex;align-items:center;gap:7px;margin-top:8px}.countctl button{border:1px solid #ccc;background:#fff;border-radius:8px;width:36px;height:32px;font-size:19px;font-weight:800}.countctl span{min-width:72px;text-align:center;font-weight:800}
.mini-timer{position:absolute;right:10px;top:10px;width:150px;background:#f7f7f7;border:1px solid #d4d4d4;border-radius:10px;padding:6px}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mini-clock{font-size:18px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.mini-label{font-size:9px;color:#666;text-align:center}
.mini-buttons{display:flex;gap:4px;margin-top:4px}.mini-buttons button{flex:1;border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 2px;font-size:10px;font-weight:700}
.mini-settings{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.mini-settings input{padding:4px;font-size:11px;text-align:center}
.worktimer{background:#f7f7f7;border-radius:10px;padding:9px;margin:9px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.workclock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.worktimer button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 9px;font-weight:700}
.history-item{cursor:pointer}.history-item:active{background:#eee}
.history-date{font-weight:800}.history-sub{font-size:12px;color:#666;margin-top:4px}
@media(max-width:420px){
 .exname,.rx{padding-right:0}
 .mini-timer{position:static;width:100%;margin-top:8px}
}
@media(max-width:380px){.settop{grid-template-columns:36px 1fr 1fr 1fr}.set input{font-size:14px}}
</style>
</head>
<body>
<header><h1>Workout Log</h1><p>Power Building｜PRE → BBB → PPP W1〜W8 → TEST</p></header>
<main><nav id="nav"></nav><div id="app"></div></main>

<script>
const tabs=["HOME","PRE","BBB","PPP","HISTORY"];
const BBB={
"Legs":[["バーベルスクワット",4,"6〜8"],["レッグエクステンション",6,"10〜15"],["ハックスクワット",6,"8〜12"],["レッグプレス",6,"10〜15"],["スミスマシンスクワット",6,"8〜12"],["レッグカール",3,"10〜15"]],
"Chest":[["ベンチプレス",15,"6〜10"],["インクラインベンチプレス",10,"8〜12"],["ダンベルベンチプレス",4,"8〜12"],["ダンベルフライ",5,"10〜15"],["チェストプレスマシン",6,"8〜12"],["ディップチンアシスト",5,"8〜15"]],
"Shoulders":[["OHP",10,"6〜10"],["スミスバックプレス",10,"8〜12"],["ケーブルアップライトロウ",5,"10〜15"],["ダンベルサイドレイズ",10,"12〜20"],["リアデルトフライ",5,"12〜20"],["ショルダープレスマシン",3,"8〜12"]],
"Back":[["デッドリフト",4,"4〜6"],["トップサイドデッドリフト",10,"6〜10"],["バーベルベントオーバーロウ",10,"8〜12"],["Tバーロウマシン",5,"8〜12"],["シーテッドロー",10,"8〜15"],["ラットプルダウン",6,"8〜15"]],
"Arms":[["クローズグリップベンチ",8,""],["JMプレス",8,""],["スミスOHエクステンション",5,""],["バーベルカール",10,"8〜12"],["ケーブルカール",8,"8〜12"],["プリーチャーカール",5,"8〜12"]]
};
const PRE=[
["High-bar SQ","Ascending → Top 135kg × 4〜6","Back-off：Top −5kg × 1"],
["Competition BP","Ascending → Top 85kg × 4〜6","Back-off：Top −2.5kg × 1"],
["Competition DL","Ascending → Top 180kg × 1","必要なら185〜190kg確認"]
];
const E=(name,sets,rep,rx="",note="")=>({name,sets,rep,rx,note});
const P={};
for(let w=1;w<=4;w++)P["PPP W"+w]={
D1:[E("Competition SQ",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition BP",3,"2","60〜65% / RPE 5〜6","Technique"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("ブルガリアンスクワット",2,"8/脚","RPE 5〜6")],
D2:[E("Competition SQ",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Competition BP",3,"3","77.5〜82.5% / RPE 7〜8","Main Strength"),E("Stiff-leg DL",3,"4","65〜72.5% / RPE 6〜7","パワーグリップ"),E("RDL",2,"6〜8","RPE 6〜7"),E("ハイローマシン",3,"8〜12","RPE 7〜8")],
D3:[E("High-bar SQ",3,"4","65〜72.5% / RPE 6〜7","SQ variation"),E("Larsen BP",3,"4","67.5〜75% / RPE 6〜7","BP variation"),E("Competition DL",2,"2","60〜65% / RPE 5〜6","素手"),E("バーベルカール",2,"8〜12","RPE 7〜8")],
D4:[E("Competition BP",3,"2","82.5〜87.5% / RPE 7.5〜8.5","Heavy / Specificity"),E("Competition DL",3,"1〜2","80〜87.5% / RPE 7〜8.5","パワーグリップ"),E("ナローベンチ",2,"5〜8","RPE 7"),E("OHP",2,"5〜8","RPE 7")],
D5:[E("Pause SQ",3,"3","60〜70% / RPE 6前後","Drum Protection"),E("ワイドグリップTバーロウ",2,"8〜10","RPE 6〜7","低疲労")]
};
P["PPP W5"]={D1:[E("Competition SQ",4,"4","約70%","Competition volume"),E("Competition BP",4,"4","約70%","Competition volume"),E("Competition DL",2,"3","65〜67.5%","素手")],D2:[E("Competition SQ",4,"4","約75%"),E("Competition BP",4,"4","約75%"),E("Competition DL",3,"3","70〜72.5%","パワーグリップ")],D3:[E("Competition SQ",3,"4","約70%"),E("Competition BP",4,"4","72.5〜75%")],D4:[E("Competition BP",3,"3","77.5〜80%"),E("Competition DL",3,"2","75〜80%","パワーグリップ")],D5:[E("Competition SQ",3,"3","65〜70%"),E("Competition BP",3,"3","65〜70%"),E("Competition DL",2,"3","65〜67.5%","素手")]};
P["PPP W6"]={D1:[E("Competition SQ",1,"3","80%"),E("Competition SQ",1,"2","85%"),E("Competition SQ",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%"),E("Competition BP",1,"1","90%","状態確認上限")],D2:[E("Competition DL",1,"2","80%","パワーグリップ"),E("Competition DL",1,"1","87.5%","パワーグリップ"),E("Competition DL",1,"1","90%","状態確認上限"),E("Competition BP",1,"3","80%"),E("Competition BP",1,"2","85%")],D3:[E("Competition SQ",1,"2","80%"),E("Competition SQ",1,"1","85%"),E("Competition BP",2,"3","80%")],D4:[E("Competition DL",1,"2","80%"),E("Competition DL",1,"1","85%"),E("Competition BP",1,"2","80%")]};
P["PPP W7"]={D1:[E("Competition SQ",3,"2","75%"),E("Competition BP",3,"3","75%")],D2:[E("Competition DL",3,"1","70〜75%")],D3:[E("Competition BP",2,"3","75%")]};
P["PPP W8"]={"TEST前":[E("Competition SQ",1,"2","50〜60%","動作確認のみ"),E("Competition BP",1,"2","50〜60%","動作確認のみ"),E("Competition DL",1,"1","50〜60%","動作確認のみ")],"TEST":[E("SQ 1RM",3,"試技","SQ → BP → DL"),E("BP 1RM",3,"試技","SQ → BP → DL"),E("DL 1RM",3,"試技","SQ → BP → DL")]};

let current="HOME";
let bbbDay=localStorage.getItem("bbbDay")||"Legs";
let selectedWeek=localStorage.getItem("selectedWeek")||"PPP W1";
let selectedDay=localStorage.getItem("selectedDay")||"D1";
let activeSession=null;
let store=JSON.parse(localStorage.getItem("pbWorkoutV6")||"{}");
let runtime={};
let workout={elapsed:0,running:false,interval:null};

const nav=document.getElementById("nav"),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
const today=()=>new Date().toISOString().slice(0,10);

function beep(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=new C(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;g.gain.value=.16;o.connect(g);g.connect(c.destination);
  o.start();o.stop(c.currentTime+.22);
 }catch(e){}
}
function sessionKey(type,day,date){return type+"|"+day+"|"+date}
function newSession(type,day){
 const date=today(),key=sessionKey(type,day,date);
 activeSession=key;
 if(!store[key])store[key]={type,day,date,sets:{},rest:{},exerciseRest:{},counts:{},note:"",weight:"",sleep:"",fatigue:"",elapsed:0,savedAt:null};
 save();resetRuntime();workout.elapsed=store[key].elapsed||0;
}
function getSession(){
 if(!activeSession){newSession(current==="BBB"?"BBB":current==="PRE"?"PRE":selectedWeek, current==="BBB"?bbbDay:current==="PRE"?"D1":selectedDay)}
 return store[activeSession];
}
function save(){localStorage.setItem("pbWorkoutV6",JSON.stringify(store))}
function resetRuntime(){Object.values(runtime).forEach(t=>{if(t.interval)clearInterval(t.interval)});runtime={}}
function timer(id,type,seconds){
 const key=id+"|"+type;
 if(!runtime[key])runtime[key]={left:seconds||0,running:false,interval:null};
 return runtime[key];
}
function startTimer(id,type){
 const t=timer(id,type,0);if(t.running||t.left<=0)return;
 t.running=true;t.interval=setInterval(()=>{
  t.left--;
  if(t.left<=0){clearInterval(t.interval);t.interval=null;t.running=false;t.left=0;beep()}
  updateTimer(id);
 },1000);updateTimer(id)
}
function pauseTimer(id,type){const t=timer(id,type,0);if(t.interval)clearInterval(t.interval);t.interval=null;t.running=false;updateTimer(id)}
function resetTimer(id,type,seconds){pauseTimer(id,type);timer(id,type,seconds).left=Math.min(900,Math.max(0,Number(seconds)||0));updateTimer(id)}
function updateTimer(id){
 ["rest","exercise"].forEach(type=>{let e=document.getElementById("t_"+safe(id)+"_"+type);if(e)e.textContent=fmt(timer(id,type,0).left)})
}
function safe(s){return btoa(unescape(encodeURIComponent(s))).replace(/=/g,"")}
function startWorkout(){if(workout.running)return;workout.running=true;workout.interval=setInterval(()=>{workout.elapsed++;let s=getSession();s.elapsed=workout.elapsed;save();let e=document.getElementById("workClock");if(e)e.textContent=fmt(workout.elapsed)},1000)}
function pauseWorkout(){if(workout.interval)clearInterval(workout.interval);workout.interval=null;workout.running=false}
function resetWorkout(){pauseWorkout();workout.elapsed=0;let e=getSession();e.elapsed=0;save();let x=document.getElementById("workClock");if(x)x.textContent=fmt(0)}
function setTimerSetting(id,type,v){
 const s=getSession(),field=type==="rest"?"rest":"exerciseRest";
 s[field]??={};s[field][id]=Math.min(900,Math.max(0,Number(v)||0));save();resetTimer(id,type,s[field][id])
}
function exerciseTimer(id){
 const s=getSession();s.rest??={};s.exerciseRest??={};
 const rs=s.rest[id]??90, es=s.exerciseRest[id]??180;
 if(!runtime[id+"|rest"])timer(id,"rest",rs);
 if(!runtime[id+"|exercise"])timer(id,"exercise",es);
 return `<div class="mini-timer">
  <div class="mini-row">
   <div><div class="mini-label">SET REST</div><div id="t_${safe(id)}_rest" class="mini-clock">${fmt(timer(id,"rest",rs).left)}</div></div>
   <div><div class="mini-label">種目間</div><div id="t_${safe(id)}_exercise" class="mini-clock">${fmt(timer(id,"exercise",es).left)}</div></div>
  </div>
  <div class="mini-buttons">
   <button onclick="startTimer('${esc(id)}','rest')">SET開始</button><button onclick="startTimer('${esc(id)}','exercise')">種目開始</button>
  </div>
  <div class="mini-buttons">
   <button onclick="pauseTimer('${esc(id)}','rest')">停止</button><button onclick="pauseTimer('${esc(id)}','exercise')">停止</button>
  </div>
  <div class="mini-settings">
   <input type="number" min="0" max="900" value="${esc(rs)}" onchange="setTimerSetting('${esc(id)}','rest',this.value)" title="セット間秒">
   <input type="number" min="0" max="900" value="${esc(es)}" onchange="setTimerSetting('${esc(id)}','exercise',this.value)" title="種目間秒">
  </div>
 </div>`
}
function meta(){
 const s=getSession();return `<div class="meta">
  <div><label>日付</label><input type="date" value="${esc(s.date)}" onchange="changeSessionDate(this.value)"></div>
  <div><label>体重 kg（任意）</label><input inputmode="decimal" value="${esc(s.weight)}" oninput="setMeta('weight',this.value)"></div>
 </div>
 <div class="meta">
  <div><label>睡眠</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.sleep==n?"on":""}" onclick="setMeta('sleep',${n})">${n}</button>`).join("")}</div></div>
  <div><label>疲労</label><div class="choice">${[1,2,3,4,5].map(n=>`<button class="${s.fatigue==n?"on":""}" onclick="setMeta('fatigue',${n})">${n}</button>`).join("")}</div></div>
 </div>`
}
function setMeta(f,v){getSession()[f]=v;save();render()}
function changeSessionDate(date){
 const old=getSession(),type=old.type,day=old.day,newKey=sessionKey(type,day,date);
 if(newKey!==activeSession){
  if(store[newKey]){activeSession=newKey}
  else{store[newKey]={...old,date,savedAt:null};delete store[activeSession];activeSession=newKey}
  save()
 }
 render()
}
function setField(id,f,v){const s=getSession();s.sets??={};s.sets[id]??={};s.sets[id][f]=v;save()}
function setCount(name,v){const s=getSession();s.counts??={};s.counts[name]=Math.max(1,Math.min(30,Number(v)||1));save();render()}
function setCountDelta(name,delta,def){const s=getSession();s.counts??={};s.counts[name]=Math.max(1,Math.min(30,(s.counts[name]??def)+delta));save();render()}
function setBlockData(type,day){
 activeSession=sessionKey(type,day,today());
 if(!store[activeSession])newSession(type,day);else{resetRuntime();workout.elapsed=store[activeSession].elapsed||0}
}
function inputSet(k,id,index,asc=false){
 const s=getSession(),r=s.sets?.[id]||{};
 return `<div class="set"><div class="settop">
  <div class="setno">${asc?"A":"Set"} ${index+1}</div>
  <div><label>重量 kg</label><input inputmode="decimal" value="${esc(r.weight||"")}" oninput="setField('${esc(id)}','weight',this.value)"></div>
  <div><label>Rep</label><input inputmode="numeric" value="${esc(r.rep||"")}" oninput="setField('${esc(id)}','rep',this.value)"></div>
  <div><label>RPE</label><input inputmode="decimal" value="${esc(r.rpe||"")}" oninput="setField('${esc(id)}','rpe',this.value)"></div>
 </div><div class="formrow">
  <div><label>フォーム</label><select onchange="setField('${esc(id)}','form',this.value)"><option value="">—</option><option ${r.form==="◎"?"selected":""}>◎</option><option ${r.form==="○"?"selected":""}>○</option><option ${r.form==="△"?"selected":""}>△</option><option ${r.form==="×"?"selected":""}>×</option></select></div>
  <div><label>メモ</label><input value="${esc(r.memo||"")}" oninput="setField('${esc(id)}','memo',this.value)"></div>
 </div></div>`
}
function exerciseCard(k,e,idx,variable=false){
 const s=getSession(),count=variable?(s.counts?.[e.name]??e.sets):e.sets;
 let asc="",main="";
 for(let i=0;i<3;i++)asc+=inputSet(k,k+"|"+e.name+"|ASC|"+i,i,true);
 for(let i=0;i<count;i++)main+=inputSet(k,k+"|"+e.name+"|MAIN|"+i,i,false);
 const ctl=variable?`<div class="countctl"><button onclick="setCountDelta('${esc(e.name)}',-1,${e.sets})">−</button><span>${count} Mainセット</span><button onclick="setCountDelta('${esc(e.name)}',1,${e.sets})">＋</button></div>`:"";
 return `<div class="exercise"><div class="exhead"><div class="exname">${esc(e.name)}</div><div class="rx"><strong>処方：</strong>${count}セット × ${esc(e.rep)}${e.rx?"｜"+esc(e.rx):""}${e.note?"<br>"+esc(e.note):""}</div>${ctl}${exerciseTimer(k+"|"+e.name)}</div><details class="asc"><summary>▶ Ascending Set</summary>${asc}</details><div class="sectiontitle">MAIN SET</div>${main}</div>`
}
function workTimer(){
 const s=getSession();return `<div class="worktimer"><div><div class="small">トレーニング時間</div><div id="workClock" class="workclock">${fmt(workout.elapsed||s.elapsed||0)}</div></div><div><button onclick="startWorkout()">開始</button><button onclick="pauseWorkout()">停止</button><button onclick="resetWorkout()">リセット</button></div></div>`
}
function end(){
 const s=getSession();return `<label>当日メモ・特記事項</label><textarea oninput="setMeta('note',this.value)">${esc(s.note||"")}</textarea><div class="action"><button class="primary" onclick="commit()">保存</button><button class="secondary" onclick="resetSession()">リセット</button></div>`
}
function commit(){const s=getSession();s.savedAt=Date.now();s.elapsed=workout.elapsed;save();alert("保存しました")}
function resetSession(){if(confirm("このトレーニングログをリセットしますか？")){delete store[activeSession];save();newSession(getSession().type,getSession().day);render()}}
function navDraw(){nav.innerHTML=tabs.map(t=>`<button class="${t===current?"active":""}" onclick="go('${t}')">${t}</button>`).join("")}
function go(t){pauseWorkout();resetRuntime();current=t;activeSession=null;navDraw();render();scrollTo(0,0)}
function selectBBB(n){bbbDay=n;localStorage.setItem("bbbDay",n);activeSession=null;render()}
function selectWeek(w){selectedWeek=w;localStorage.setItem("selectedWeek",w);selectedDay=Object.keys(P[w]||{})[0]||"D1";localStorage.setItem("selectedDay",selectedDay);activeSession=null;render()}
function selectDay(d){selectedDay=d;localStorage.setItem("selectedDay",d);activeSession=null;render()}
function openHistory(k){activeSession=k;const s=store[k];current=s.type==="BBB"?"BBB":s.type==="PRE"?"PRE":"PPP";if(current==="BBB")bbbDay=s.day;if(current==="PPP"){selectedWeek=s.type;selectedDay=s.day}resetRuntime();workout.elapsed=s.elapsed||0;navDraw();render();scrollTo(0,0)}
function history(){
 const a=Object.entries(store).filter(([k,v])=>v.savedAt).sort((a,b)=>b[1].savedAt-a[1].savedAt);
 return `<div class="card"><h2>履歴</h2><div class="small">同じ種目・同じ曜日でも、日付ごとに別ログとして保存。</div></div>`+
 (a.length?a.map(([k,v])=>`<div class="card history-item" onclick="openHistory('${esc(k)}')"><div class="history-date">${esc(v.date||"—")}｜${esc(v.type)}｜${esc(v.day)}</div><div class="history-sub">保存：${new Date(v.savedAt).toLocaleString("ja-JP")}｜体重 ${esc(v.weight||"—")}kg｜トレーニング ${fmt(v.elapsed||0)}</div></div>`).join(""):"<div class='card'>保存履歴なし</div>")
}
function render(){
 if(current==="HOME"){
  app.innerHTML=`<div class="card"><h2>Workout Log</h2><div class="notice">1回のトレーニングを1ログとして保存。Ascending / Mainを分離し、タイマーは各種目カード内に配置。</div><h3>構成</h3><span class="badge">PRE</span><span class="badge">BBB</span><span class="badge">PPP W1〜W8</span><h3>タイマー</h3><div class="small">セット間・種目間とも最大15分。終了時はカウントダウンなしで1回だけ通知音。</div></div>`;
 }
 else if(current==="PRE"){
  setBlockData("PRE","D1");let k="PRE";
  app.innerHTML=`<div class="card"><h2>PRE Week 1</h2><div class="notice">初期キャリブレーション。固定1RM決定ではなく、BBB初期重量・フォーム・動作を校正。</div>${meta()}${workTimer()}${PRE.map((x,i)=>exerciseCard(k,{name:x[0],sets:1,rep:x[1],rx:x[2]},i)).join("")}${end()}</div>`;
 }
 else if(current==="BBB"){
  const days=[["月","Legs"],["水","Chest"],["木","Shoulders"],["土","Back"],["日","Arms"]];
  setBlockData("BBB",bbbDay);let k="BBB";
  app.innerHTML=`<div class="card"><h2>BBB</h2><div class="daytabs">${days.map(([d,n])=>`<button class="${n===bbbDay?"active":""}" onclick="selectBBB('${n}')">${d} ${n}</button>`).join("")}</div><div class="small">各種目のMainセット数を − / ＋ で変更可能。</div></div><div class="card"><h2>${days.find(x=>x[1]===bbbDay)[0]}：${bbbDay}</h2>${meta()}${workTimer()}${BBB[bbbDay].map((x,i)=>exerciseCard(k,{name:x[0],sets:x[1],rep:x[2]},i,true)).join("")}${end()}</div>`;
 }
 else if(current==="PPP"){
  const weeks=Object.keys(P);if(!weeks.includes(selectedWeek))selectedWeek=weeks[0];const days=Object.keys(P[selectedWeek]||{});if(!days.includes(selectedDay))selectedDay=days[0];
  setBlockData(selectedWeek,selectedDay);let k="PPP";
  app.innerHTML=`<div class="card"><h2>PPP</h2><div class="weektabs">${weeks.map(w=>`<button class="${w===selectedWeek?"active":""}" onclick="selectWeek('${w}')">${w.replace("PPP ","W")}</button>`).join("")}</div><div class="daytabs">${days.map(d=>`<button class="${d===selectedDay?"active":""}" onclick="selectDay('${d}')">${d}</button>`).join("")}</div><div class="small">週とDayをタブで切替。</div></div><div class="card"><h2>${selectedWeek}：${selectedDay}</h2>${meta()}${workTimer()}${P[selectedWeek][selectedDay].map((e,i)=>exerciseCard(k,e,i)).join("")}${end()}</div>`;
 }
 else app.innerHTML=history();
}
navDraw();render();
</script>
